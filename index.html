<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモン対戦 - 6体パーティ & 3on3バトル</title>
<style>
  :root{
    --bg:#0e1726; --panel:#16213a; --panel2:#1d2b4d; --line:#2c3e63;
    --txt:#eaf1ff; --sub:#9fb3d6; --accent:#ffcb05; --blue:#3b6bd6; --mega:#b061ff;
    --hp-green:#46d160; --hp-yellow:#f5c542; --hp-red:#ef4b4b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1b2c4f,#0e1726 60%);color:var(--txt);min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:20px;text-align:center;margin:8px 0 4px}
  h1 span{color:var(--accent)}
  .sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:12px}
  .hidden{display:none}.center{text-align:center}
  .btn{background:var(--accent);color:#0e1726;border:none;font-weight:800;font-size:15px;padding:10px 24px;border-radius:30px;cursor:pointer;margin:6px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.mega{background:linear-gradient(135deg,#8a2be2,#b061ff);color:#fff}
  .btn.mega.armed{animation:megaGlow 1s infinite alternate}
  @keyframes megaGlow{from{box-shadow:0 0 8px rgba(176,97,255,.5)}to{box-shadow:0 0 20px rgba(176,97,255,1)}}
  .menu{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:24px}
  .mode-menu{display:flex;justify-content:center;gap:12px;margin:18px 0 8px}
  .mode-btn{min-width:150px;font-size:17px;padding:14px 28px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .mode-btn.practice{background:#46b96b;color:#fff}
  .mode-btn.battle{background:linear-gradient(135deg,#e84b4b,#f28c3d);color:#fff}

  /* dex grid */
  .grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .mon-card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;width:128px;cursor:pointer;transition:.12s;text-align:center}
  .mon-card:hover{border-color:var(--blue)}
  .mon-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,203,5,.3)}
  .mon-card.dim{opacity:.4}
  .mon-card img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
  .mon-card .nm{font-size:12px;font-weight:700;margin-top:2px}
  .types{display:flex;gap:4px;justify-content:center;margin:3px 0}
  .type{font-size:10px;padding:1px 6px;border-radius:9px;color:#0e1726;font-weight:700}
  .mini{font-size:10px;color:var(--sub)}
  .order-badge{display:inline-block;background:var(--accent);color:#0e1726;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:800;line-height:18px}

  /* party slots */
  .slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .pslot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;width:150px;text-align:center}
  .pslot img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
  select{background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px;font-family:inherit;width:100%;margin-top:4px}
  select.stone{border-color:var(--mega)}

  /* battle */
  .field{background:linear-gradient(#243a66,#16213a);border:2px solid var(--line);border-radius:14px;padding:14px;position:relative}
  .weatherBadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:2px 12px;border-radius:12px;background:rgba(0,0,0,.35)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
  .mon{display:flex;align-items:center;gap:12px}
  .mon img{width:116px;height:116px;object-fit:contain;image-rendering:pixelated}
  .info{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 12px;min-width:225px}
  .info .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .info .ab{font-size:11px;color:var(--sub)}
  .info .stg{font-size:11px;color:var(--accent);font-weight:700;min-height:13px}
  .dots{display:flex;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--hp-green);border:1px solid #0c1322}
  .dot.dead{background:#444}
  .hpbar{height:9px;background:#0c1322;border-radius:6px;overflow:hidden;margin-top:5px}
  .hpfill{height:100%;background:var(--hp-green);transition:width .5s,background .5s}
  .hpnum{font-size:11px;color:var(--sub);text-align:right;margin-top:2px}
  .hit{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .faint{opacity:.2;filter:grayscale(1)}
  @keyframes megaPulse{0%{filter:none;transform:scale(1)}25%{filter:drop-shadow(0 0 14px #b061ff) drop-shadow(0 0 28px #8a2be2);transform:scale(1.18)}60%{filter:drop-shadow(0 0 22px #b061ff) brightness(1.5) saturate(1.6);transform:scale(1.1)}100%{filter:drop-shadow(0 0 6px #b061ff);transform:scale(1)}}
  .mega-anim{animation:megaPulse 1s ease}
  .dynamax-aura{filter:drop-shadow(0 0 7px #ff2020) drop-shadow(0 0 16px #b40000)}
  .log{background:#0c1322;border:2px solid var(--line);border-radius:12px;height:110px;overflow-y:auto;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:12px}
  .cmd{margin-top:10px}
  .actrow{display:flex;gap:10px;justify-content:center}
  .actrow .btn{flex:1;max-width:200px}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .move{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;color:var(--txt)}
  .move:hover{border-color:var(--accent)}.move:disabled{opacity:.45;cursor:not-allowed}
  .move .mn{font-weight:700;font-size:13px}
  .move .md{font-size:11px;color:var(--sub);margin-top:2px;display:flex;justify-content:space-between;align-items:center}
  .cat{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;color:#0e1726}
  .cat.phys{background:#ff7043}.cat.spec{background:#42a5f5}.cat.status{background:#9fb3d6}
  .switchrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .sw{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px;width:120px;cursor:pointer;text-align:center}
  .sw:hover{border-color:var(--accent)}.sw.dead{opacity:.35;cursor:not-allowed}.sw.active{border-color:var(--blue)}
  .sw img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated}
  .sw .swhp{font-size:10px;color:var(--sub)}
  .result{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
  /* type colors */
  .t-normal{background:#a8a77a}.t-fire{background:#ee8130}.t-water{background:#6390f0}.t-electric{background:#f7d02c}
  .t-grass{background:#7ac74c}.t-ice{background:#96d9d6}.t-fighting{background:#c22e28;color:#fff}.t-poison{background:#a33ea1;color:#fff}
  .t-ground{background:#e2bf65}.t-flying{background:#a98ff3}.t-psychic{background:#f95587}.t-bug{background:#a6b91a}
  .t-rock{background:#b6a136}.t-ghost{background:#735797;color:#fff}.t-dragon{background:#6f35fc;color:#fff}
  .t-dark{background:#705746;color:#fff}.t-steel{background:#b7b7ce}.t-fairy{background:#d685ad}
</style>

<div class="wrap">
  <h1>⚔ <span>ポケモン対戦</span> ⚔</h1>
  <div class="sub">6体パーティを編成 → 見せ合い → 3体えらんで 3on3バトル（交代・天候あり）</div>

  <div id="home">
    <div class="grid" id="homeHero"></div>
    <div class="mode-menu">
    </div>
    <div class="menu">
      <button class="btn blue" onclick="show('train')">🎓 ポケモンを育成する（技・特性）</button>
      <button class="btn blue" onclick="openPartyBuilder('cpu')">🛠 パーティを編成する（6体）</button>
      <button class="btn" id="goBattle" onclick="startCpu()" disabled>⚔ CPUとたたかう（要：6体）</button>
      <button class="btn mega" onclick="startLunaticStage()"><img src="image/image/ザシアン.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ</button>
      <button class="btn mega" onclick="startLunaticStage2()"><img src="image/image/メガボーマンダ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ2</button>
      <button class="btn mega" onclick="startLunaticStage3()"><img src="image/image/メガヒードラン.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ3</button>
      <button class="btn mega" onclick="startLunaticStage4()"><img src="image/image/メガダークライ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ4</button>
      <button class="btn mega" onclick="startLunaticStage5()"><img src="image/image/メガレックウザ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ5</button>
      <button class="btn mega" onclick="startDynamaxUnlockStage()"><img src="image/image/ムゲンダイナ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ダイマックス解放</button>
      <label class="sub">NPCレベル <select id="npcLevel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <button class="btn ghost" onclick="startFriendSetup()">👥 フレンドとたいせん（2人）</button>
      <button class="btn ghost" onclick="showItemDex()">🎒 持ち物一覧</button>
      <button class="btn ghost" onclick="showPokemonDex()">📖 ポケモン一覧</button>
      <div class="sub" id="streakLabel">最大連勝記録：0勝</div>
      <div class="sub" style="margin-top:14px">📖 ポケモン一覧</div>
      <div class="grid" id="homeDex"></div>
    </div>
  </div>

  <div id="train" class="hidden">
    <div class="sub">育成したいポケモンをえらんで、技(4つ)と特性をカスタマイズ（1Pとフレンドで別々に保存）</div>
    <div class="center" style="margin:10px 0 12px">
      <button class="btn blue" id="trainP1Btn" onclick="setTrainOwner('p1')">1Pを育成</button>
      <button class="btn ghost" id="trainP2Btn" onclick="setTrainOwner('p2')">フレンドを育成</button>
    </div>
    <div class="grid" id="trainGrid"></div>
    <div id="trainEdit" class="hidden"></div>
    <div class="center" style="margin-top:12px"><button class="btn ghost" onclick="show('home')">← もどる（保存）</button></div>
  </div>

  <div id="party" class="hidden">
    <div class="sub" id="partyTitle">使う6体をえらんで、各ポケモンの持ち物を設定（メガストーンでメガシンカ可能）</div>
    <div class="slots" id="partySlots"></div>
    <div class="grid" id="dexGrid"></div>
    <div class="center" id="partyNav" style="margin-top:12px"></div>
  </div>

  <div id="preview" class="hidden">
    <div class="sub" style="color:var(--accent)" id="previewTopLabel">あいてのパーティ（6体）</div>
    <div class="grid" id="foePreview"></div>
    <div class="sub" style="margin-top:14px" id="previewMyLabel">出す3体をえらんでください</div>
    <div class="grid" id="myPreview"></div>
    <div class="center" style="margin-top:12px">
      <button class="btn" id="startBtn" disabled>えらんだ3体で バトル！</button>
      <button class="btn ghost" onclick="show('home')">← もどる</button>
    </div>
  </div>

  <div id="battle" class="hidden">
    <div class="field">
      <div class="weatherBadge hidden" id="weatherBadge"></div>
      <div class="row"><div class="dots" id="foeDots"></div>
        <div class="mon" style="flex-direction:row-reverse">
          <img id="foeImg"><div class="info">
            <div class="nm"><span id="foeName"></span><span>Lv.50</span></div>
            <div class="ab" id="foeAb"></div><div class="stg" id="foeStg"></div>
            <div class="hpbar"><div class="hpfill" id="foeHp"></div></div>
            <div class="hpnum" id="foeHpNum"></div>
          </div></div>
      </div>
      <div class="row">
        <div class="mon"><img id="myImg"><div class="info">
            <div class="nm"><span id="myName"></span><span>Lv.50</span></div>
            <div class="ab" id="myAb"></div><div class="stg" id="myStg"></div>
            <div class="hpbar"><div class="hpfill" id="myHp"></div></div>
            <div class="hpnum" id="myHpNum"></div>
          </div></div>
        <div class="dots" id="myDots"></div>
      </div>
    </div>
    <div class="log" id="log"></div>
    <div class="cmd" id="cmd"></div>
    <div class="center hidden" id="endArea">
      <div class="result" id="resultTxt"></div>
      <button class="btn ghost" onclick="show('home')">メニューにもどる</button>
    </div>
  </div>
</div>

function moveEffText(mv){const t=[];if(mv.hpPower)t.push("残りHPで威力変化（最大150・最低10）");if(mv.accuracy)t.push(`命中${Math.round(mv.accuracy*100)}%`);if(mv.prio)t.push(`優先度+${mv.prio}`);if(mv.cut)t.push("切る技");if(mv.firstTurnOnly)t.push("出てすぐのターンのみ");if(mv.highCrit)t.push(`急所率${Math.round((mv.critRate||.125)*1000)/10}%`);if(mv.critMult)t.push(`急所ダメージ${mv.critMult}倍`);if(mv.flinch)t.push(`${Math.round(mv.flinch*100)}%で相手を行動不能`);if(mv.freeze)t.push(`${Math.round(mv.freeze*100)}%でこおり`);if(mv.burn)t.push(`${Math.round(mv.burn*100)}%でやけど`);if(mv.poison)t.push(`${Math.round(mv.poison*100)}%でどく`);if(mv.paralyze)t.push(`${Math.round(mv.paralyze*100)}%でまひ`);if(mv.healDamage)t.push(`与えたダメージの${Math.round(mv.healDamage*100)}%回復`);if(mv.hypersleep)t.push("100%で超眠気（25%で行動不能・被ダメージ1.25倍）");if(mv.hazard==="rocks")t.push("交代で出た相手に最大HP1/10ダメージ");if(mv.hazard==="toxicspikes")t.push("交代してきた相手を毒にする。2回で猛毒");if(mv.selfBoost){const st=statEffectStats(mv.selfBoost),ch=statEffectChance(mv.selfBoost);t.push(`${ch<1?Math.round(ch*100)+"%で":""}自分の`+Object.keys(st).map(k=>STAT_JP[k]).join("・")+"↑");}if(mv.selfDrop)t.push("使用後 自分の"+Object.keys(mv.selfDrop).map(k=>STAT_JP[k]).join("・")+"↓");if(mv.targetDrop)t.push(`${Math.round(mv.targetDrop.chance*100)}%で相手の`+Object.keys(mv.targetDrop.stats).map(k=>STAT_JP[k]).join("・")+"↓");return t.join(" / ");}

// 育成内容（セッション保持）：1Pとフレンドで技4つ・特性を別々に保存
function createBuild(){
  const b={};
  SPECIES.forEach(sp=>{ b[sp.id]={ moves:sp.moves.slice(), ability:sp.abil }; });
  return b;
}
const builds={p1:createBuild(), p2:createBuild()};
let trainOwner="p1";
const SAVE_FLAGS=["ritoLunaticClear","ritoLunatic2Clear","ritoLunatic3Clear","ritoLunatic4Clear","ritoLunatic5Clear","ritoDynamaxClear"];
function saveGame(){
  const flags={};
  SAVE_FLAGS.forEach(k=>{if(localStorage.getItem(k)==="1")flags[k]=1;});
  const encodeParty=list=>list.map(p=>({...p,sp:SPECIES[p.sp]?.id||p.sp}));
  localStorage.setItem("ritoGameSave",JSON.stringify({version:3,builds,party:encodeParty(party),party2:encodeParty(party2),flags,streak:Number(localStorage.getItem("ritoStreak")||0)}));
}
function loadGame(){try{const s=JSON.parse(localStorage.getItem("ritoGameSave")||"null");if(s){
  if(s.builds) ["p1","p2"].forEach(owner=>{if(s.builds[owner]) Object.assign(builds[owner],s.builds[owner]);});
  const decodeParty=list=>Array.isArray(list)?list.map(p=>{const id=typeof p.sp==="number"?SPECIES[p.sp]?.id:p.sp;const sp=SPECIES.findIndex(x=>x.id===id);return sp>=0?{...p,sp}:null;}).filter(Boolean):[];
  if(Array.isArray(s.party))party=decodeParty(s.party);if(Array.isArray(s.party2))party2=decodeParty(s.party2);
  if(s.flags&&typeof s.flags==="object") SAVE_FLAGS.forEach(k=>{if(s.flags[k]===1)localStorage.setItem(k,"1");});
}}catch(e){}}
function ownerBuild(owner){ return builds[owner]||builds.p1; }
function buildOf(sp,owner="p1"){ const b=ownerBuild(owner); if(!b[sp.id]) b[sp.id]={moves:sp.moves.slice(),ability:sp.abil}; return b[sp.id]; }
function spMoves(sp,owner="p1"){ return buildOf(sp,owner).moves; }
function spAbil(sp,owner="p1"){ return ABIL[buildOf(sp,owner).ability]||ABIL[sp.abil]; }
function ownerForBuilder(){ return builderMode==="p2" ? "p2" : "p1"; }

function typeTags(types){return types.map(t=>`<span class="type t-${t}">${TYPE_JP[t]}</span>`).join("");}
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function sampleFour(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,4);
}

function renderParty(){
  if(!curParty) curParty=party;
  const owner=ownerForBuilder();
  document.getElementById("partyTitle").textContent =
    builderMode==='p1' ? "プレイヤー1のパーティ：6体えらんで持ち物を設定" :
    builderMode==='p2' ? "プレイヤー2のパーティ：6体えらんで持ち物を設定" :
    "使う6体をえらんで、各ポケモンの持ち物を設定（メガストーンでメガシンカ可能）";
  const slots=document.getElementById("partySlots");
  slots.innerHTML="";
  for(let i=0;i<6;i++){
    if(curParty[i]){
      const sp=SPECIES[curParty[i].sp];
      const savedMoves=spMoves(sp,owner);
      const movePool=[...new Set([...(sp.learnset||[]),...savedMoves])];
      // 持ち物一覧に登録されている全アイテムを選択可能にする。
      // メガストーン／ナイトもITEMSへ自動登録されているため、ここで一緒に表示する。
      const itemKeys=Object.keys(ITEMS).filter(k=>!ITEMS[k].mega||ITEMS[k].mega===curParty[i].sp);
      slots.innerHTML+=`<div class="pslot">
        <img src="${IMG(sp.img)}"><div style="font-size:12px;font-weight:700">${sp.name}</div>
        <div class="mini">特性：${spAbil(sp,owner).name}</div>
        <select onchange="setItem(${i},this.value)" class="${ITEMS[curParty[i].item].mega?'stone':''}">
          ${itemKeys.map(k=>`<option value="${k}" ${curParty[i].item===k?'selected':''}>${ITEMS[k].name}</option>`).join("")}
        </select>
        <div class="mini" style="margin-top:5px">技</div>
        ${[0,1,2,3].map(mi=>`<select onchange="setPartyMove(${i},${mi},this.value)" style="font-size:11px;margin-top:2px">
          ${movePool.map(k=>`<option value="${k}" ${savedMoves[mi]===k?'selected':''}>${MOVES[k]?.name||k}</option>`).join("")}
        </select>`).join("")}
        <button class="btn ghost" style="font-size:11px;padding:3px 10px;margin-top:4px" onclick="removeParty(${i})">はずす</button>
      </div>`;
    }else{
      slots.innerHTML+=`<div class="pslot" style="opacity:.5"><div style="font-size:34px;color:var(--line)">＋</div><div class="mini">空き</div></div>`;
    }
  }
  const g=document.getElementById("dexGrid"); g.innerHTML="";
  SPECIES.forEach((sp,i)=>{ if(sp.hidden)return;
    const inParty=curParty.some(p=>p.sp===i);
    const full=curParty.length>=6;
    g.innerHTML+=`<div class="mon-card ${inParty?'sel':''} ${(!inParty&&full)?'dim':''}" onclick="toggleParty(${i})">
      <img src="${IMG(sp.img)}"><div class="nm">${sp.name}</div>
      <div class="types">${typeTags(sp.types)}</div>
      <div class="mini">${spAbil(sp,owner).name}</div>
      <div class="mini">${sp.megas.length?'★メガ可':''}</div>
    </div>`;
  });
  // ナビ
  const nav=document.getElementById("partyNav");
  if(builderMode==='p1') nav.innerHTML=`<button class="btn" ${party.length===6?'':'disabled'} onclick="friendP1Done()">プレイヤー2へ → (${party.length}/6)</button> <button class="btn ghost" onclick="show('home')">やめる</button>`;
  else if(builderMode==='p2') nav.innerHTML=`<button class="btn" ${party2.length===6?'':'disabled'} onclick="friendP2Done()">見せ合いへ → (${party2.length}/6)</button> <button class="btn ghost" onclick="openPartyBuilder('p1')">← P1へ</button> <button class="btn ghost" onclick="show('home')">やめる</button>`;
  else nav.innerHTML=`<button class="btn ghost" onclick="show('home')">← もどる（保存）</button>`;
}
function toggleParty(i){
  if(SPECIES[i].id==="zacian"&&localStorage.getItem("ritoLunaticClear")!=="1"){ alert("ルナティックステージをクリアするまでザシアンは使用できません。"); return; }
  if(SPECIES[i].id==="salamence"&&localStorage.getItem("ritoLunatic2Clear")!=="1"){ alert("ルナティックステージ2をクリアするまでボーマンダは使用できません。"); return; }
  if(SPECIES[i].id==="heatran"&&localStorage.getItem("ritoLunatic3Clear")!=="1"){ alert("ルナティックステージ3をクリアするまでヒードランは使用できません。"); return; }
  if(SPECIES[i].id==="darkrai"&&localStorage.getItem("ritoLunatic4Clear")!=="1"){ alert("ルナティックステージ4をクリアするまでダークライは使用できません。"); return; }
  if(SPECIES[i].id==="rayquaza"&&localStorage.getItem("ritoLunatic5Clear")!=="1"){ alert("ルナティックステージ5をクリアするまでレックウザは使用できません。"); return; }
  const idx=curParty.findIndex(p=>p.sp===i);
  if(idx>=0){ curParty.splice(idx,1); }
  else if(curParty.length<6){ curParty.push({sp:i,item:"none"}); }
  saveGame(); renderParty();
}
function removeParty(slot){ curParty.splice(slot,1); saveGame(); renderParty(); }
function setItem(slot,val){ curParty[slot].item=val; saveGame(); renderParty(); }
function setPartyMove(slot,moveSlot,val){
  const sp=SPECIES[curParty[slot]?.sp];
  if(!sp)return;
  const moves=spMoves(sp,ownerForBuilder());
  if(moveSlot<4)moves[moveSlot]=val;
  saveGame(); renderParty();
}

let trainSel=-1;

function renderTrain(){
  document.getElementById("trainP1Btn").className=trainOwner==="p1"?"btn blue":"btn ghost";
  document.getElementById("trainP2Btn").className=trainOwner==="p2"?"btn blue":"btn ghost";
  const g=document.getElementById("trainGrid"); g.innerHTML="";
  SPECIES.forEach((sp,i)=>{ if(sp.hidden)return;
    g.innerHTML+=`<div class="mon-card ${trainSel===i?'sel':''}" onclick="selectTrain(${i})">
      <img src="${IMG(sp.img)}"><div class="nm">${sp.name}</div>
      <div class="types">${typeTags(sp.types)}</div>
      <div class="mini">${trainOwner==="p1"?"1P":"フレンド"} 特性:${spAbil(sp,trainOwner).name}</div></div>`;
  });
  renderTrainEdit();
}
function selectTrain(i){ trainSel=i; renderTrain(); }
function renderTrainEdit(){
  const box=document.getElementById("trainEdit");
  if(trainSel<0){ box.classList.add("hidden"); box.innerHTML=""; return; }
  box.classList.remove("hidden");
  const sp=SPECIES[trainSel], b=buildOf(sp,trainOwner);
  let slots="";
  for(let s=0;s<4;s++){
    const opts=sp.learnset.map(k=>{
      const used=b.moves.includes(k)&&b.moves[s]!==k;
      return `<option value="${k}" ${b.moves[s]===k?'selected':''} ${used?'disabled':''}>${M[k].name}（${TYPE_JP[M[k].type]}/${catLabel(M[k])} 威${M[k].power}）</option>`;
    }).join("");
    slots+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span class="mini" style="width:16px">${s+1}</span>
      <select onchange="setTrainMove(${s},this.value)">${opts}</select></div>`;
  }
  const abilOpts=sp.abils.map(k=>`<label style="display:block;background:var(--panel2);border:1px solid ${b.ability===k?'var(--accent)':'var(--line)'};border-radius:8px;padding:6px 9px;margin-bottom:5px;cursor:pointer;font-size:12px">
      <input type="radio" name="abil" ${b.ability===k?'checked':''} onclick="setTrainAbil('${k}')"> ${ABIL[k].name}<span class="mini" style="display:block;margin-left:20px">${ABDESC[k]||''}</span></label>`).join("");
  box.innerHTML=`<div style="max-width:420px;margin:10px auto 0;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:14px;text-align:left">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <img src="${IMG(sp.img)}" style="width:60px;height:60px;image-rendering:pixelated">
      <div><div style="font-weight:700;font-size:15px">${trainOwner==="p1"?"1P":"フレンド"}：${sp.name}</div><div class="types">${typeTags(sp.types)}</div></div></div>
    <div class="mini" style="margin-bottom:8px">種族値 HP${sp.base.hp} こう${sp.base.atk} ぼう${sp.base.def} 特こう${sp.base.spa} 特ぼう${sp.base.spd} 素${sp.base.spe}</div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px">わざ（入れ替え可）</div>${slots}
    <div style="font-weight:700;font-size:13px;margin:10px 0 6px">特性</div>${abilOpts}
    <div class="center"><button class="btn ghost" style="font-size:12px;padding:4px 14px" onclick="resetTrain()">初期設定にもどす</button></div>

// ===== ダメージ計算 =====
function calcDamage(attacker,defender,move,isCrit){
  if(move.cat==="status"||((move.chargedPower!==undefined?move.chargedPower:move.power)<=0)) return {dmg:0,eff:1,stab:false};
  if(defender.abilEff==="disguise"&&!defender.usedDisguise)return {dmg:0,eff:0,stab:false,disguise:true};
  const skinType=attacker.abilEff==="aerilate"?"flying":attacker.abilEff==="dragonskin"?"dragon":null;
  const moveType=skinType&&move.type==="normal"?skinType:move.type;
  if(!move.ignoreAbility&&((defender.abilEff==="flashfire"&&moveType==="fire")||(defender.abilEff==="magmaheat"&&moveType==="ground")||(defender.abilEff==="eartheater"&&moveType==="ground"))) return {dmg:0,eff:0,stab:false};
  let atkStage=(move.cat==="spec")?attacker.stages.spa:attacker.stages.atk;
  let defStage=(move.cat==="spec")?defender.stages.spd:defender.stages.def;
  // シャドークローは相手の防御ランク上昇を無視する。
  if(move.ignoreDefBoost&&defStage>0)defStage=0;
  if(!move.ignoreAbility&&defender.abilEff==="unaware") atkStage=0;
  if(!move.ignoreAbility&&attacker.abilEff==="unaware") defStage=0;
  if(isCrit){ if(atkStage<0)atkStage=0; if(defStage>0)defStage=0; }
  let atkStat=((move.cat==="spec")?attacker.base.spa:attacker.base.atk)*stageMult(atkStage);
  let defStat=((move.cat==="spec")?defender.base.spd:defender.base.def)*stageMult(defStage);
  if(defender.itemKey==="eviolite"&&!defender.isMega)defStat*=1.5;
  if(move.lowDef){
    const physDef=defender.base.def*stageMult(defender.stages.def);
    const specDef=defender.base.spd*stageMult(defender.stages.spd);
    defStat=Math.min(physDef,specDef);
  }
  if(attacker.abilEff==="hugepower"&&move.cat==="phys") atkStat*=2;            // ちからもち
  if(attacker.itemKey==="powerband") atkStat*=1.05;
  if(attacker.abilEff==="supremeoverlord"){const team=attacker===me?myTeam:foeTeam;atkStat*=1+Math.min(5,team.filter(m=>m.fainted).length)*.1;}
  if(attacker.abilEff==="sheerforce"&&sheerForceBoosts(move)) atkStat*=1.3;    // ちからずく
  if(attacker.status==="burn"&&move.cat==="phys") atkStat*=0.5;                // やけど
  if(weather==="sand"&&defender.types.includes("rock")&&move.cat==="spec") defStat*=1.5; // 砂:いわ特防↑
  let stab=attacker.abilEff==="libero"?1.2:(attacker.types.includes(moveType)?1.3:1.0);
  if(attacker.abilEff==="adaptability"&&stab>1) stab=2.0;
  // ふんか：残りHPの割合で威力が変化（最大150、最低10）
  let movePower=move.chargedPower!==undefined?move.chargedPower:(move.hpPower?Math.max(10,Math.floor(150*attacker.curHp/attacker.maxHp)):move.power);
  if(move.statusPower&&defender.status) movePower*=move.statusPower;
  if(move.faintBonus){const team=attacker===me?myTeam:foeTeam;movePower=Math.min(move.maxPower||movePower,movePower+team.filter(m=>m.fainted).length*move.faintBonus);}
  let attack=atkStat*stab*movePower, defense=defender.base.hp*defStat;
  let dmg=(attack/defense)*42;
  const eff=effMultiplier(moveType,defender.types); dmg*=eff;
  // ルナティックステージ2のメガボーマンダは弱点ダメージを4/3倍に抑える
  if((defender.lunatic2Boss||defender.lunatic3Boss)&&eff>1) dmg*=((4/3)/eff);
  // 天候によるタイプ補正
  if(weather==="rain"){ if(moveType==="water")dmg*=1.3; else if(moveType==="fire")dmg*=0.5; }
  else if(weather==="sun"){ if(moveType==="fire")dmg*=1.5; else if(moveType==="water")dmg*=0.5; }
  if(attacker.abilEff==="sunpower"&&weather==="sun"&&move.cat==="spec") dmg*=1.5;
  // ピンチ特性（HP1/3以下）
  const low=attacker.curHp<=attacker.maxHp/3;
  if(low&&((attacker.abilEff==="torrent"&&moveType==="water")||(attacker.abilEff==="blaze"&&moveType==="fire"))) dmg*=1.5;
  // メガボーマンダ／メガオーダイルのすてみタックルは専用強化
  if((move===M.takedown||move._baseMove===M.takedown)&&attacker.isMega&&(attacker.id==="salamence"||attacker.id==="ohdairu")) dmg*=1.2;
  if(attacker.abilEff==="sandforce") dmg*=1.2;
  if(move.weakBoost&&eff>1)dmg*=move.weakBoost;
  if(move.megaBonus&&defender.isMega) dmg*=2;
  if(attacker.isMega&&!defender.isMega) dmg*=1.2;
  if(attacker.itemKey==="orb") dmg*=1.3;
  if(attacker.itemKey==="healcrown") dmg*=1.05;
  if(attacker.itemKey==="powerband") dmg*=1.10;
  if(attacker.itemKey==="band"&&move.cat==="phys") dmg*=1.3;
  if(attacker.itemKey==="specs"&&move.cat==="spec") dmg*=1.3;
  if(attacker.itemKey==="lightstone"){ atkStat*=1.1; dmg*=1.1; }
  if(!move.ignoreAbility&&defender.abilEff==="aurashield"&&move.cat==="phys") dmg*=0.5;
  if(!move.ignoreAbility&&defender.abilEff==="prankster") dmg*=0.9;
  if(!move.ignoreAbility&&defender.abilEff==="purifyingSalt"&&move.type==="ghost") dmg*=0.5;
  if(defender.status==="hypersleep") dmg*=1.25;
  if(grassTurns>0&&moveType==="grass") dmg*=1.3;
  if(electricTurns>0&&moveType==="electric") dmg*=1.33;
  if(psychicTurns>0&&moveType==="psychic") dmg*=1.33;
  if(mistTurns>0&&moveType==="fairy") dmg*=1.33;
  if(mistTurns>0&&moveType==="dragon"&&eff>1) dmg*=((4/3)/eff);
  if(isCrit) dmg*=move.critMult||1.5;
  else{ if(defender.abilEff==="multiscale"&&defender.curHp===defender.maxHp) dmg*=0.5; }
  return {dmg: eff===0?0:Math.max(1,Math.floor(dmg)), eff, stab:stab>1};
}
function sheerForceBoosts(move){return !!(move.targetDrop||move.flinch||move.freeze||move.burn||move.poison||move.paralyze||(move.selfBoost&&move.selfBoost.chance));}
function effSpeed(m){
  // 同じレベルで戦うため、種族値ではなく素早さ実数値を基準に比較する
  let s=Math.floor(m.base.spe*2*LEVEL/100+5)*stageMult(m.stages.spe||0);
  if(m.status==="paralyze")s*=0.5;
  if(m.abilEff==="swiftswim"&&weather==="rain")s*=2;
  if(m.itemKey==="lightstone")s*=1.1;
  if(m.itemKey==="scarf")s*=1.5;
  return s;
}
function movePriority(mon,move){
  return (move.prio||0)
    +(mon.abilEff==="prankster"&&move.cat==="status"?2:0)
    +(move.grassPriority&&grassTurns>0?4:0)
    +(mon.quickDraw?2:0);
}
const MAX_MOVE_NAMES={normal:"ダイノーマル",fire:"ダイホノオ",water:"ダイウォーター",electric:"ダイサンダー",grass:"ダイリーフ",ice:"ダイアイス",fighting:"ダイナックル",poison:"ダイアシッド",ground:"ダイアース",flying:"ダイジェット",psychic:"ダイサイコ",bug:"ダイワーム",rock:"ダイロック",ghost:"ダイオバケ",dragon:"ダイドラゴン",dark:"ダイアーク",steel:"ダイスチル",fairy:"ダイフェアリー"};
function maxMoveFor(mon,move){
  if(!mon.isDynamax)return move;
  const sourcePower=move.chargedPower!==undefined?move.chargedPower:move.power;
  if(move.cat==="status"||sourcePower<=0)return Object.assign({},move,{name:"ダイフォール",maxMove:true,protect:true,power:0});
  let name=MAX_MOVE_NAMES[move.type]||"ダイマックスわざ", extra={};
  if(mon.isGigantamax){
    if(mon.id==="cinderace"&&move.name==="かえんボール") {name="キョダイカキュウ";extra.ignoreAbility=true;}
    if(mon.id==="centiskorch"&&move.name==="ほのおのむち") {name="キョダイネツホウ";extra.trapTurns=3;extra.trapDenom=8;}
    if(mon.id==="gorillander"&&move.name==="ドラムアタック") {name="キョダイゴランダ";extra.targetDrop={chance:1,stats:{spe:-2}};extra.cureGrassStatus=true;}
    if(mon.id==="lizardon"&&mon.name.includes("X")){name="キョダイドラリュウ";extra.percentDamage=mon.hitBeforeMove?.40:.20;}
    else if(mon.id==="lizardon"&&mon.name.includes("Y")){name="キョダイバクエン";extra.healDamage=.5;}
    else if(mon.id==="lizardon"&&move.type==="fire"){name="キョダイゴクエン";extra.weakBoost=4/3;}
    if(mon.id==="darkrai"&&move.name==="ダークホール"){name="キョダイスイマ";extra.percentDamage=.10;extra.hypersleep=true;extra.hypersleepPower=2;}
  }
  const multiPower=move.multiHit?(sourcePower*(move.multiHit===5?3:move.multiHit)):sourcePower;
  let power=extra.hypersleep&&move.cat!=="status"&&move.type==="dark"?140:Math.min(140,Math.max(90,multiPower+30));
  if(mon.id==="lizardon"&&mon.isGigantamax&&mon.name.includes("X")||mon.id==="lizardon"&&mon.isGigantamax&&mon.name.includes("Y")){if(mon.dynamaxTurns===1)power=Math.floor(power*2/3);}
  const max=Object.assign({},move,extra,{name,power,chargedPower:undefined,_baseMove:move,maxMove:true});
  if(!extra.targetDrop)delete max.targetDrop; delete max.selfBoost; delete max.selfDrop;
  return max;
}
function applyMaxMoveEffect(attacker,defender,move){
  if(!move.maxMove)return;
  const t=move.type;
  if(t==="grass"){grassTurns=5;pushLog("  ☘ グラスフィールドになった！","#7ac74c");}
  else if(t==="fire"){setWeather("sun","ひざしが つよくなった！");}
  else if(t==="water"){setWeather("rain","あめが ふりはじめた！");}
  else if(t==="ice"){setWeather("hail","あられが ふりはじめた！");}
  else if(t==="rock"){setWeather("sand","すなあらしが ふきはじめた！");}
  else if(t==="electric"){electricTurns=5;pushLog("  ⚡ エレキフィールドになった！","#f8d030");}
  else if(t==="psychic"){psychicTurns=5;pushLog("  🧠 サイコフィールドになった！","#f85888");}
  else if(t==="fairy"){mistTurns=5;pushLog("  ✨ ミストフィールドになった！","#ee99ac");}
  const self={poison:{spa:1},fighting:{atk:1},flying:{spe:1},ground:{spd:1},steel:{def:1}}[t];
  const target=move.targetDrop||{normal:{spe:-1},bug:{spa:-1},dragon:{def:-1},ghost:{def:-1},dark:{spd:-1}}[t];
  if(self)applyDrop(attacker,self); if(target&&defender.curHp>0)applyDrop(defender,target);
  if(move.cureGrassStatus&&defender.status&&["poison","toxic","burn","paralyze","sleep","hypersleep"].includes(defender.status)){defender.status=null;pushLog(`  ・ ${defender.name} の状態異常が回復した！`,"#7ac74c");renderStages();}
}
function runMultiHit(attacker,defender,move,defImgId,cb){
  const count=attacker.itemKey==="steadydice"?3:move.multiHit;
  const hitMove=Object.assign({},move,{multiHit:null,accuracy:attacker.itemKey==="steadydice"?1:move.accuracy,selfBoost:null,selfDrop:null});
  let i=0;
  const next=()=>{
    if(i>=count||defender.fainted||attacker.fainted){
      if(move.selfBoost)tryStatEffect(attacker,move.selfBoost);
      if(move.selfDrop)applyDrop(attacker,move.selfDrop);
      cb();return;
    }
    i++; attack(attacker,defender,hitMove,defImgId,next);
  };
  next();
}

// ===== ターン解決 =====
function series(tasks,done){let i=0;const nx=()=>{ if(i>=tasks.length){done();return;} tasks[i++](nx); };nx();}
function doResolve(){
  busy=true; clearCmd();
  me.protectActive=false; foe.protectActive=false;
  me.turnMoved=false; foe.turnMoved=false; me.hitBeforeMove=false; foe.hitBeforeMove=false; me.flinched=false; foe.flinched=false;
  const A=turnAct.me, B=turnAct.foe;
  const phaseSwitch=(next)=>{const t=[];
    if(A.type==="switch") t.push(cb=>doSwitch("me",A.idx,cb));
    if(B.type==="switch") t.push(cb=>doSwitch("foe",B.idx,cb));
    series(t,next);};
  const phaseMega=(next)=>{const t=[];
    if(!rayMegaActive&&A.type==="move"&&megaArm.me&&((me.stoneMatches&&!me.isMega)||(canRayMega(me)))){megaArm.me=false;t.push(cb=>doMega(me,"myImg",cb));}
    const cpuRainMega=(mode==='cpu'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock')&&B.type==="switch"&&foe.id==="ragulaaji"&&weather==="rain";
    if(!rayMegaActive&&foe.stoneMatches&&!foe.isMega&&((mode==='cpu'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock')||megaArm.foe||cpuRainMega)){megaArm.foe=false;t.push(cb=>doMega(foe,"foeImg",cb));}
    series(t,next);};
  const phaseMax=(next)=>{const t=[];
    if(!rayMegaActive&&A.type==="move"&&maxArm.me&&!me.isDynamax&&me.id!=="zacian"&&me.id!=="eternatus"&&(!me.isMega||GMAX_IDS.has(me.id))){maxArm.me=false;t.push(cb=>doDynamax(me,"myImg",cb));}
    if(!rayMegaActive&&B.type==="move"&&maxArm.foe&&!foe.isDynamax&&foe.id!=="zacian"&&foe.id!=="eternatus"&&(!foe.isMega||GMAX_IDS.has(foe.id))){maxArm.foe=false;t.push(cb=>doDynamax(foe,"foeImg",cb));}
    series(t,next);
  };
  const phaseAttack=(next)=>{
    const movers=[];
    if(A.type==="move") movers.push({who:"me",move:A.move,mon:me});
    if(B.type==="move") movers.push({who:"foe",move:B.move,mon:foe});
    movers.forEach(m=>{m.mon.quickDraw=false;if(m.mon.abilEff==="quickdraw"&&Math.random()<.2){m.mon.quickDraw=true;pushLog(`  ★ ${m.mon.name} の クイックドロウ！ 優先度が上がった！`,"#ffcb05");} });
    movers.sort((a,b)=>{
      const pa=movePriority(a.mon,a.move), pb=movePriority(b.mon,b.move);
      if(pa!==pb) return pb-pa;
      // 優先度が同じなら、実数値の高い方を必ず先に行動させる
      return effSpeed(b.mon)-effSpeed(a.mon);
    });
    runAttacks(movers,0,next);
  };
  phaseSwitch(()=>phaseMax(()=>phaseMega(()=>phaseAttack(()=>endTurn()))));
}
function runAttacks(movers,i,done){
  if(i>=movers.length){done();return;}
  const m=movers[i], atk=activeOf(m.who), def=activeOf(m.who==="me"?"foe":"me"), defImg=m.who==="me"?"foeImg":"myImg";
  if(atk!==m.mon){ runAttacks(movers,i+1,done); return; }
  if(atk.fainted){ runAttacks(movers,i+1,done); return; }
  if(def.fainted){ runAttacks(movers,i+1,done); return; }
  if(atk.outrageTurns>0) m.move=M.outrage;
  if(atk.flinched&&atk.abilEff!=="focus"){ atk.flinched=false; atk.firstTurnReady=false; setTimeout(()=>{pushLog(`  └ ${atk.name} は ひるんで 動けない！`,"#ffcb05");runAttacks(movers,i+1,done);},450); return; }
  if(atk.status==="freeze"){
    if(Math.random()<0.25){ atk.status=null; renderStages(); pushLog(`  └ ${atk.name} の こおりが とけた！`,"#7ad1ff"); }
    else { atk.firstTurnReady=false; setTimeout(()=>{pushLog(`  └ ${atk.name} は こおって 動けない！`,"#9fb3d6");runAttacks(movers,i+1,done);},450); return; }
  }
  if(atk.status==="paralyze"&&Math.random()<0.2){
    atk.firstTurnReady=false;
    setTimeout(()=>{pushLog(`  └ ${atk.name} は しびれて 動けない！`,"#ffcb05");runAttacks(movers,i+1,done);},450);
    return;
  }
  if(atk.status==="sleep"){
    atk.sleepTurns--;
    if(atk.sleepTurns<=0){atk.status=null;pushLog(`  └ ${atk.name} は ねむりから 起きた！`);}
    else {setTimeout(()=>{pushLog(`  └ ${atk.name} は ぐうぐう ねむっている！`,"#9fb3d6");runAttacks(movers,i+1,done);},450);return;}
  }
  if(atk.status==="hypersleep"&&Math.random()<.25){
    setTimeout(()=>{pushLog(`  └ ${atk.name} は 超眠気で 動けない！`,"#9fb3d6");runAttacks(movers,i+1,done);},450);return;
  }
  atk.turnMoved=true;
  const defSide=m.who==="me"?"foe":"me";
  if(m.move.requiresAttack&&(!turnAct[defSide]||turnAct[defSide].type!=="move")){
    pushLog(`  └ ${atk.name} の ふいうちは しっぱいした！`,"#9fb3d6");
    runAttacks(movers,i+1,done); return;
  }
  attack(atk,def,m.move,defImg,()=>{
    tryEmergencyExit(defSide,def,()=>{
      if(m.move.switchAfter&&!atk.fainted&&teamOf(m.who).some((p,j)=>j!==activeIdxOf(m.who)&&!p.fainted)) requestForcedSwitch(m.who,()=>runAttacks(movers,i+1,done));

function canStatus(mon,status,source){
  if(mon.abilEff==="purifyingSalt") return false;
  if(mon.status) return false;
  if(status==="burn"&&mon.types.includes("fire")) return false;
  if(status==="freeze"&&mon.types.includes("ice")) return false;
  if((status==="poison"||status==="toxic")&&(mon.types.includes("poison")||mon.types.includes("steel"))&&(!source||source.abilEff!=="corrosion")) return false;
  return true;
}
function applyStatus(mon,status,source){
  if(!canStatus(mon,status,source)){
    if(!mon.status) pushLog(`  ・ ${mon.name} には ${statusName(status)}が 効かない！`,"#9fb3d6");
    return false;
  }
  mon.status=status;
  mon.toxicTurns=0;
  if(mon.itemKey==="gritbelt"&&!mon.usedGritBelt){const h=Math.max(1,Math.floor(mon.maxHp*.50));mon.curHp=Math.min(mon.maxHp,mon.curHp+h);mon.usedGritBelt=true;pushLog(`  ★ ふんばりベルトで HP${h}回復！`,"#46d160");renderHp();}
  if(source&&source.itemKey==="firstbell"&&!source.usedFirstBell&&!source.fainted){const h=Math.max(1,Math.floor(source.maxHp*.30));source.curHp=Math.min(source.maxHp,source.curHp+h);source.usedFirstBell=true;pushLog(`  ★ さきがけベルで HP${h}回復！`,"#46d160");renderHp();}
  renderStages();
  const txt=status==="freeze"?"こおってしまった":status==="burn"?"やけどを おった":status==="poison"?"どくを あびた":status==="toxic"?"もうどくを あびた":"まひしてしまった";
  pushLog(`  ・ ${mon.name} は ${txt}！`,status==="burn"?"#ff7043":(status==="poison"||status==="toxic")?"#b061ff":status==="paralyze"?"#ffcb05":"#7ad1ff");

// ききかいひ：攻撃後にHPが半分以下になったら自動で交代する。

    if((mode==='cpu'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock')&&side==='foe') doSwitch(side,next,cb);

  if(mon.id==="rayquaza")rayMegaActive=true; else rayMegaBlocked=true;
  const mg=mon.megaForm, old=mon.name;
  pushLog(`✨ ${old} は 紫の殻に包まれた…！`,"#b061ff");
  const img=document.getElementById(imgId); img.classList.add("mega-anim");
  setTimeout(()=>{
    mon.name=mg.name; mon.types=mg.types.slice(); mon.base=Object.assign({},mg.base);
    if(mon.id==="hydreigon"){
      for(const stat of ["atk","def","spa","spd"])mon.base[stat]=Math.floor(mon.base[stat]*1.2);
    }
    const ab=ABIL[mg.abil]; mon.abilName=ab.name; mon.abilEff=ab.eff; mon.isMega=true;
    mon.img=mg.img;                       // メガ後の見た目を保持（再描画でも解除されない）
    if(mon.id==="heatran") mon.moves=mon.moves.map(m=>m.name==="マグマストーム"?M.steelfever:m);
    if(mon.id==="zacian") mon.moves=mon.moves.map(m=>m.name==="アイアンヘッド"?M.behemothblade:m);
    mon.acted=0; mon.firstTurnReady=true;  // メガ進化後はであいがしらを再度使える
    img.src=IMG(mg.img);
    document.getElementById(imgId==="myImg"?"myName":"foeName").textContent=mon.name;
    setAbLine(); renderHp(); renderStages();
    pushLog(`✨ ${old} は ${mg.name} に メガシンカした！`,"#b061ff");
    // メガ後の特性が天候を呼ぶ場合（ひでり等）
    applyEntry(mon,imgId,()=>{ img.classList.remove("mega-anim"); cb(); });
  },1000);
}

// ===== 交代 =====
function doSwitch(side,idx,cb){
  megaArm[side]=false;
  if(side==="me"){
    const out=me; out.subHp=0; out.stages={atk:0,spa:0,def:0,spd:0,spe:0};
    out.flinched=false; out.turnMoved=false; out.firstTurnReady=false;
    myA=idx; me=myTeam[idx]; me.acted=0; me.firstTurnReady=true; me.flinched=false; me.turnMoved=false;
    pushLog(`${out.name} を ひっこめて ${me.name}！`);
    renderActive();
    applyHazards("me",()=>{ if(me.fainted) cb(); else applyEntry(me,"myImg",cb); });
  }else{
    const out=foe; out.subHp=0; out.stages={atk:0,spa:0,def:0,spd:0,spe:0};
    out.flinched=false; out.turnMoved=false; out.firstTurnReady=false;
    foeA=idx; foe=foeTeam[idx]; foe.acted=0; foe.firstTurnReady=true; foe.flinched=false; foe.turnMoved=false;
    pushLog(`${mode==='friend'?'プレイヤー2は':'あいては'} ${out.name} を もどして ${foe.name} を くりだした！`);
    renderActive();
    applyHazards("foe",()=>{ if(foe.fainted) cb(); else applyEntry(foe,"foeImg",cb); });
  }
}
function applyHazards(side,cb){
  const mon=activeOf(side), h=hazards[side], tasks=[];
  if(mon.fainted){ cb(); return; }
  if(mon.itemKey==="boots"){ cb(); return; }
  if(h.rocks) tasks.push(next=>setTimeout(()=>{
    const d=Math.max(1,Math.floor(mon.maxHp/10));
    mon.curHp=Math.max(0,mon.curHp-d);
    renderHp();
    pushLog(`  ▲ ${mon.name} に ステルスロックが ささった！ ${d} ダメージ！`,"#b6a136");
    if(mon.curHp<=0) faintMon(mon,imgOf(side));
    next();
  },420));
  if(h.spikes>0&&!mon.types.includes("flying")&&mon.abilEff!=="levitate") tasks.push(next=>setTimeout(()=>{
    const denom=[16,8,4,2][Math.min(h.spikes-1,3)];
    const d=Math.max(1,Math.floor(mon.maxHp/denom));
    mon.curHp=Math.max(0,mon.curHp-d);
    renderHp();
    pushLog(`  ▲ ${mon.name} に まきびしが ささった！ ${d} ダメージ！`,"#b6a136");
    if(mon.curHp<=0) faintMon(mon,imgOf(side));
    next();
  },350));
  if(h.toxicSpikes>0) tasks.push(next=>setTimeout(()=>{
    if(!mon.fainted){
      const src={abilEff:h.toxicCorrosion?"corrosion":null};
      applyStatus(mon,h.toxicSpikes>=2?"toxic":"poison",src);
    }
    next();
  },300));
  if(!tasks.length) cb(); else series(tasks,cb);
}

// ===== CPU思考 =====
function cpuChoose(){
  if(mode==='lunatic'&&foe.id==='hippowdon'&&foe.acted===0&&Math.random()<.70) return {type:"move",move:M.stealthrock};
  if(mode==='lunatic'&&foe.id==='cinderace'&&foe.curHp<=foe.maxHp*.2&&Math.random()<.85) return {type:"move",move:M.suckerpunch};
  // ペリッパー先発→雨が降ったらラグラージに交代
  if(foe.id==="pelipper"&&foe.acted>=1&&weather==="rain"){
    const ri=foeTeam.findIndex(m=>m.id==="ragulaaji"&&!m.fainted);
    if(ri>=0&&ri!==foeA) return {type:"switch",idx:ri};
  }
  let cand=foe.moves.filter(mv=>!(mv.firstTurnOnly&&(foe.acted||0)>0)&&!(psychicTurns>0&&mv.prio>0)&&!(mv.onceBattle&&foe.usedPlayTogether));
  if(!cand.length)cand=foe.moves;
  const valid=cand.filter(mv=>mv.cat==="status"||calcDamage(foe,me,mv,false).eff!==0);
  if(valid.length)cand=valid;
  // 攻撃技がある場合、つるぎのまい等の自己強化だけを連続選択しない。
  const attackable=cand.filter(mv=>mv.cat!=="status"&&mv.power>0&&calcDamage(foe,me,mv,false).eff!==0);
  if(attackable.length)cand=cand.filter(mv=>mv.cat!=="status"||!mv.selfBoost);
  const weak=cand.filter(mv=>calcDamage(foe,me,mv,false).eff>1);
  if(mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock'){
    let best=cand[0],bs=-1;
    for(const mv of cand){
      const hit=mv.accuracy||1, eff=effMultiplier(mv.type,me.types);
      const score=calcDamage(foe,me,mv,false).dmg*hit*(eff>1?1.25:1);
      if(score>bs){bs=score;best=mv;}
    }
    return {type:"move",move:best};
  }
  if(weak.length&&Math.random()<.30) return {type:"move",move:pickOne(weak)};
  if(Math.random()<Math.max(.02,.18-npcLevel*.025)) return {type:"move",move:cand[Math.floor(Math.random()*cand.length)]};
  let best=cand[0],bd=-1;
  for(const mv of cand){const d=calcDamage(foe,me,mv,false).dmg;if(d>bd){bd=d;best=mv;}}
  return {type:"move",move:best};
}
function cpuForcedSwitch(){
  const alive=foeTeam.map((m,i)=>i).filter(i=>!foeTeam[i].fainted&&i!==foeA);
  if(!alive.length) return -1;
  // 一番ダメージを通せる相手を選ぶ
  let best=alive[0],bs=-1;
  for(const i of alive){let mx=0;for(const mv of foeTeam[i].moves){const d=calcDamage(foeTeam[i],me,mv,false).dmg*effMultiplier(mv.type,me.types?me.types:[]);if(d>mx)mx=d;}if(mx>bs){bs=mx;best=i;}}
  return best;
}

// ===== ターン終了処理 =====
function applyResidual(mon,imgId,source){
  if(mon.fainted) return;
  let d=0, label="", color="#9fb3d6";
  if(mon.status==="burn"){ d=Math.max(1,Math.floor(mon.maxHp/16)); label="やけど"; color="#ff7043"; }
  else if(mon.status==="poison"){ d=Math.max(1,Math.floor(mon.maxHp/(mon.id==="gliscor"?36:8))); label="どく"; color="#b061ff"; }
  else if(mon.status==="toxic"){
    mon.toxicTurns=(mon.toxicTurns||0)+1;
    const denom=[8,6,4,3,2,1][Math.min(mon.toxicTurns-1,5)];
    d=Math.max(1,Math.floor(mon.maxHp/denom));
    label="もうどく";
    color="#b061ff";
  }
  if(source&&source.abilEff==="magmaheat"&&!mon.types.includes("fire")){
    const denom=effMultiplier("fire",mon.types)>1?6:8;
    d=Math.max(d,Math.max(1,Math.floor(mon.maxHp/denom)));
    label="マグマのこうねつ";
    color="#ff7043";
  }
  if(mon.trapTurns>0){
    d=Math.max(d,Math.max(1,Math.floor(mon.maxHp/mon.trapDenom)));
    label="マグマストームの熱";
    color="#ff7043";
  }
  if(mon.salted){d=Math.max(1,Math.floor(mon.maxHp/(mon.types.includes("steel")||mon.types.includes("water")?4:8)));label="しおづけ";color="#7ad1ff";}
  if(mon.leechSource&&!mon.fainted){const h=Math.max(1,Math.floor(mon.maxHp/8*(mon.id==="eternatus"?.1:1)));mon.curHp=Math.max(0,mon.curHp-h);if(mon.leechSource&&!mon.leechSource.fainted)mon.leechSource.curHp=Math.min(mon.leechSource.maxHp,mon.leechSource.curHp+h);renderHp();pushLog(`  ・ ${mon.name} はヤドリギで ${h} ダメージ！`,"#7ad1ff");}
  if(mon.id==="eternatus"&&d>0)d=Math.max(1,Math.floor(d*.1));
  if(!d) return;
  mon.curHp=Math.max(0,mon.curHp-d);
  if(mon.trapTurns>0) mon.trapTurns--;
  renderHp();
  pushLog(`  ・ ${mon.name} は ${label}で ${d} ダメージ！`,color);
  if(mon.curHp<=0) faintMon(mon,imgId);
}
function cpuForceReplace(cb){
  const ni=cpuForcedSwitch();
  if(ni<0) return finish(true);
  doSwitch("foe",ni,()=>{
    if(foe.fainted){
      if(!foeTeam.some(m=>!m.fainted)) finish(true);
      else cpuForceReplace(cb);
    }else cb();
  });
}
function endTurn(){
  endDynamax(me,"myImg"); endDynamax(foe,"foeImg");
  [me,foe].forEach(m=>{if(m&&m.outrageTurns>0){m.outrageTurns--;if(m.outrageTurns===0)pushLog(`  ・ ${m.name} の げきりんが 終わった！`);}
    if(m&&m.roostedTypes){m.types=m.roostedTypes;m.roostedTypes=null;}
  });
  [me,foe].forEach(m=>{if(m&&m.yawnTurns>0){m.yawnTurns--;if(m.yawnTurns===0&&!m.status){m.status="sleep";m.sleepTurns=2+Math.floor(Math.random()*2);pushLog(`  ・ ${m.name} は ねむってしまった！`,"#9fb3d6");}}});
  [me,foe].forEach(target=>{
    const source=target===me?foe:me;
    const sleepy=target&&(target.yawnTurns>0||target.status==="sleep"||target.status==="hypersleep");
    if(source&&!source.fainted&&source.abilEff==="nightmarez"&&sleepy&&target.curHp>0){
      const d=Math.max(1,Math.floor(target.maxHp/4*(target.id==="eternatus"?.1:1)));
      target.curHp=Math.max(0,target.curHp-d); renderHp();
      pushLog(`  ★ ${source.name} の ナイトメアZ！ ${target.name} は ${d} ダメージ！`,"#b061ff");
      if(target.curHp<=0&&!target.fainted) faintMon(target,target===me?"myImg":"foeImg");
    }
  });
  [me,foe].forEach(m=>{if(m&&!m.fainted&&m.itemKey==="toxicorb"&&m.acted>=1&&!m.status){applyStatus(m,"poison",m);}});
  [me,foe].forEach(m=>{if(m&&m.switchLock>0)m.switchLock--;});
  // かそく：すばやさ+1
  [["me",me],["foe",foe]].forEach(([s,m])=>{ if(!m.fainted&&m.abilEff==="speedboost"){ m.stages.spe=Math.min(6,m.stages.spe+1); pushLog(`  ・ ${m.name} の すばやさが 上がった（かそく）`,"#ff7043"); }});
  renderStages();
  [me,foe].forEach(m=>{if(m&&m.protectCooldown>0)m.protectCooldown--;if(m&&m.abilEff==="moody"&&!m.fainted)applyMoody(m);});
  applyResidual(me,"myImg",foe);
  applyResidual(foe,"foeImg",me);
  [me,foe].forEach(m=>{
    if(m&&!m.fainted&&m.abilEff==="poisonheal"&&(m.status==="poison"||m.status==="toxic")){
      const h=Math.max(1,Math.floor(m.maxHp/(m.id==="gliscor"?7:8)));
      m.curHp=Math.min(m.maxHp,m.curHp+h);
      pushLog(`  ・ ${m.name} は ポイズンヒールで ${h} 回復！`,"#46d160");
    }
  });
  [me,foe].forEach(m=>{if(m&&!m.fainted&&(m.itemKey==="orb"||m.itemKey==="scarf")){m.curHp=Math.max(0,m.curHp-Math.max(1,Math.floor(m.maxHp/10)));pushLog(`  ・ ${m.name} は持ち物の反動でHPが減った！`,"#ff7043");}});
  if(grassTurns>0){
    [me,foe].forEach(m=>{if(m&&!m.fainted){const h=Math.max(1,Math.floor(m.maxHp/8));m.curHp=Math.min(m.maxHp,m.curHp+h);pushLog(`  ☘ ${m.name} はグラスフィールドで ${h} 回復！`,"#7ac74c");}});
    renderHp(); grassTurns--;
  }
  if(weatherTurns>0){weatherTurns--;if(weatherTurns===0){weather=null;renderWeather();pushLog("  ☁ 天候が もとに もどった！","#7ad1ff");}}
  if(electricTurns>0)electricTurns--;
  if(psychicTurns>0)psychicTurns--;
  if(mistTurns>0)mistTurns--;
  if(weather==="hail"){
    [me,foe].forEach(m=>{if(m&&!m.fainted&&!m.types.includes("ice")){const d=Math.max(1,Math.floor(m.maxHp/16*(m.id==="eternatus"?.1:1)));m.curHp=Math.max(0,m.curHp-d);pushLog(`  ・ ${m.name} は あられで ${d} ダメージ！`,"#a8d8e8");if(m.curHp<=0&&!m.fainted)faintMon(m,m===me?"myImg":"foeImg");}});
    renderHp();
  }
  // ひんしの入れ替え
  const foeDead=foe.fainted, meDead=me.fainted;
  if(!foeTeam.some(m=>!m.fainted)){ return finish(true); }
  if(!myTeam.some(m=>!m.fainted)){ return finish(false); }
  // me側の補充 → 完了したら次のターン
  const replaceMe=()=>{ meDead ? requestForcedSwitch("me", nextTurn) : nextTurn(); };
  // foe側の補充（CPUは自動 / フレンドはP2が選ぶ）
  if(foeDead){
    if(mode==='cpu'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock') cpuForceReplace(replaceMe);
    else requestForcedSwitch("foe", replaceMe);
  } else replaceMe();
}
// 強制交代：そのsideの生きているポケモンを選ぶ（このターンは攻撃なし）
function requestForcedSwitch(side,cb){
  busy=true; inputSide=side; forcedCb=cb;
  const team=teamOf(side), ai=activeIdxOf(side), c=document.getElementById("cmd");
  let h=`<div class="center sub">${sideLabel(side)}：つぎの ポケモンを えらんでください</div><div class="switchrow">`;
  team.forEach((m,i)=>{const dead=m.fainted, active=(i===ai);
    h+=`<div class="sw ${dead?'dead':''} ${active?'active':''}" ${(!dead&&!active)?`onclick="pickForced('${side}',${i})"`:''}>
      <img src="${IMG(m.img)}"><div style="font-size:11px;font-weight:700">${m.name}</div>
      <div class="swhp">${m.fainted?'ひんし':`${m.curHp}/${m.maxHp}`}</div></div>`;});
  h+='</div>';
  c.innerHTML=h;
}
function pickForced(side,i){
  clearCmd();
  const cb=forcedCb; forcedCb=null;
  doSwitch(side,i,()=>{
    if(activeOf(side).fainted&&teamOf(side).some(m=>!m.fainted)) requestForcedSwitch(side,cb);
    else cb();
  });
}
function finish(meWon){
  busy=true; clearCmd();
  if(mode==='lunatic'&&meWon) localStorage.setItem("ritoLunaticClear","1");
  if(mode==='lunatic2'&&meWon) localStorage.setItem("ritoLunatic2Clear","1");
  if(mode==='lunatic3'&&meWon) localStorage.setItem("ritoLunatic3Clear","1");
  if(mode==='lunatic4'&&meWon) localStorage.setItem("ritoLunatic4Clear","1");
  if(mode==='lunatic5'&&meWon) localStorage.setItem("ritoLunatic5Clear","1");
  if(mode==='dynamaxUnlock'&&meWon) localStorage.setItem("ritoDynamaxClear","1");
  // 解放状況も手持ち・育成内容と同じスナップショットへ保存する。
  if(meWon&&['lunatic','lunatic2','lunatic3','lunatic4','lunatic5','dynamaxUnlock'].includes(mode)) saveGame();
  if(mode==='cpu'&&npcLevel===5){let n=Number(localStorage.getItem("ritoStreak")||0);n=meWon?n+1:0;const best=Math.max(Number(localStorage.getItem("ritoMaxStreak")||0),n);localStorage.setItem("ritoStreak",String(n));localStorage.setItem("ritoMaxStreak",String(best));saveGame();}
  document.getElementById("endArea").classList.remove("hidden");
  const r=document.getElementById("resultTxt");
  if(mode==='friend') r.textContent = meWon?"🏆 プレイヤー1の勝ち！":"🏆 プレイヤー2の勝ち！";
  else r.textContent = meWon?"🏆 あなたの勝ち！":"😵 あなたの負け…";
  r.style.color=meWon?"var(--accent)":"var(--hp-red)";
}
