<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモン対戦 - 6体パーティ & 3on3バトル</title>
<style>
  :root{
    --bg:#0e1726; --panel:#16213a; --panel2:#1d2b4d; --line:#2c3e63;
    --txt:#eaf1ff; --sub:#9fb3d6; --accent:#ffcb05; --blue:#3b6bd6; --mega:#b061ff;
    --hp-green:#46d160; --hp-yellow:#f5c542; --hp-red:#ef4b4b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1b2c4f,#0e1726 60%);color:var(--txt);min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:20px;text-align:center;margin:8px 0 4px}
  h1 span{color:var(--accent)}
  .sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:12px}
  .hidden{display:none}.center{text-align:center}
  .btn{background:var(--accent);color:#0e1726;border:none;font-weight:800;font-size:15px;padding:10px 24px;border-radius:30px;cursor:pointer;margin:6px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.mega{background:linear-gradient(135deg,#8a2be2,#b061ff);color:#fff}
  .btn.mega.armed{animation:megaGlow 1s infinite alternate}
  @keyframes megaGlow{from{box-shadow:0 0 8px rgba(176,97,255,.5)}to{box-shadow:0 0 20px rgba(176,97,255,1)}}
  .menu{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:24px}
  .mode-menu{display:flex;justify-content:center;gap:12px;margin:18px 0 8px}
  .mode-btn{min-width:150px;font-size:17px;padding:14px 28px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
  .mode-btn.practice{background:#46b96b;color:#fff}
  .mode-btn.battle{background:linear-gradient(135deg,#e84b4b,#f28c3d);color:#fff}

  /* dex grid */
  .grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .mon-card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;width:128px;cursor:pointer;transition:.12s;text-align:center}
  .mon-card:hover{border-color:var(--blue)}
  .mon-card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,203,5,.3)}
  .mon-card.dim{opacity:.4}
  .mon-card img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
  .mon-card .nm{font-size:12px;font-weight:700;margin-top:2px}
  .types{display:flex;gap:4px;justify-content:center;margin:3px 0}
  .type{font-size:10px;padding:1px 6px;border-radius:9px;color:#0e1726;font-weight:700}
  .mini{font-size:10px;color:var(--sub)}
  .order-badge{display:inline-block;background:var(--accent);color:#0e1726;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:800;line-height:18px}

  /* party slots */
  .slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .pslot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;width:150px;text-align:center}
  .pslot img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
  select{background:#0c1322;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px;font-family:inherit;width:100%;margin-top:4px}
  select.stone{border-color:var(--mega)}

  /* battle */
  .field{background:linear-gradient(#243a66,#16213a);border:2px solid var(--line);border-radius:14px;padding:14px;position:relative}
  .weatherBadge{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:2px 12px;border-radius:12px;background:rgba(0,0,0,.35)}
  .towerBadge{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.48);color:#ffcb05;border:1px solid rgba(255,203,5,.55)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
  .mon{display:flex;align-items:center;gap:12px}
  .mon img{width:116px;height:116px;object-fit:contain;image-rendering:pixelated}
  .info{background:rgba(0,0,0,.28);border-radius:10px;padding:8px 12px;min-width:225px}
  .info .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .info .ab{font-size:11px;color:var(--sub)}
  .info .stg{font-size:11px;color:var(--accent);font-weight:700;min-height:13px}
  .dots{display:flex;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--hp-green);border:1px solid #0c1322}
  .dot.dead{background:#444}
  .hpbar{height:9px;background:#0c1322;border-radius:6px;overflow:hidden;margin-top:5px}
  .hpfill{height:100%;background:var(--hp-green);transition:width .5s,background .5s}
  .hpnum{font-size:11px;color:var(--sub);text-align:right;margin-top:2px}
  .hit{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .faint{opacity:.2;filter:grayscale(1)}
  @keyframes switchGreen{0%{filter:drop-shadow(0 0 0 #46d160);transform:scale(.75);opacity:.15}55%{filter:drop-shadow(0 0 20px #46d160) brightness(1.7);transform:scale(1.12);opacity:1}100%{filter:none;transform:scale(1);opacity:1}}.switch-effect{animation:switchGreen .7s ease-out}
  @keyframes faintBlue{0%{filter:drop-shadow(0 0 0 #65bfff);transform:scale(1);opacity:1}55%{filter:drop-shadow(0 0 24px #65bfff) brightness(1.8);transform:scale(1.14);opacity:.7}100%{filter:grayscale(1);transform:scale(.7);opacity:.2}}.faint-effect{animation:faintBlue .8s ease-in forwards}
  @keyframes megaPulse{0%{filter:none;transform:scale(1)}25%{filter:drop-shadow(0 0 14px #b061ff) drop-shadow(0 0 28px #8a2be2);transform:scale(1.18)}60%{filter:drop-shadow(0 0 22px #b061ff) brightness(1.5) saturate(1.6);transform:scale(1.1)}100%{filter:drop-shadow(0 0 6px #b061ff);transform:scale(1)}}
  .mega-anim{animation:megaPulse 1s ease}
  .dynamax-aura{filter:drop-shadow(0 0 7px #ff2020) drop-shadow(0 0 16px #b40000)}
  .electric-tera-aura{filter:drop-shadow(0 0 8px #ffe600) drop-shadow(0 0 20px #ffbf00) brightness(1.25)}
  .morpeko-full-aura{filter:drop-shadow(0 0 8px #ffe600) drop-shadow(0 0 20px #ffbf00) brightness(1.2)}.morpeko-hungry-aura{filter:drop-shadow(0 0 8px #bf5cff) drop-shadow(0 0 20px #6d18b8) brightness(1.2)}
  .log{background:#0c1322;border:2px solid var(--line);border-radius:12px;height:110px;overflow-y:auto;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:12px}
  #abilityToast{position:fixed;top:14px;left:50%;transform:translate(-50%,-16px);z-index:100;opacity:0;pointer-events:none;background:linear-gradient(135deg,#ffcb05,#ff8a3d);color:#182033;border:2px solid #fff3bc;border-radius:999px;padding:10px 22px;font-weight:900;font-size:16px;box-shadow:0 5px 18px rgba(0,0,0,.45);transition:opacity .18s,transform .18s}#abilityToast.show{opacity:1;transform:translate(-50%,0)}
  .cmd{margin-top:10px}
  .actrow{display:flex;gap:10px;justify-content:center}
  .actrow .btn{flex:1;max-width:200px}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .move{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;color:var(--txt)}
  .move:hover{border-color:var(--accent)}.move:disabled{opacity:.45;cursor:not-allowed}
  .move .mn{font-weight:700;font-size:13px}
  .move .md{font-size:11px;color:var(--sub);margin-top:2px;display:flex;justify-content:space-between;align-items:center}
  .cat{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700;color:#0e1726}
  .cat.phys{background:#ff7043}.cat.spec{background:#42a5f5}.cat.status{background:#9fb3d6}
  .switchrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .sw{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px;width:120px;cursor:pointer;text-align:center}
  .sw:hover{border-color:var(--accent)}.sw.dead{opacity:.35;cursor:not-allowed}.sw.active{border-color:var(--blue)}
  .sw img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated}
  .sw .swhp{font-size:10px;color:var(--sub)}
  .result{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
  /* type colors */
  .t-normal{background:#a8a77a}.t-fire{background:#ee8130}.t-water{background:#6390f0}.t-electric{background:#f7d02c}
  .t-grass{background:#7ac74c}.t-ice{background:#96d9d6}.t-fighting{background:#c22e28;color:#fff}.t-poison{background:#a33ea1;color:#fff}
  .t-ground{background:#e2bf65}.t-flying{background:#a98ff3}.t-psychic{background:#f95587}.t-bug{background:#a6b91a}
  .t-rock{background:#b6a136}.t-ghost{background:#735797;color:#fff}.t-dragon{background:#6f35fc;color:#fff}
  .t-dark{background:#705746;color:#fff}.t-steel{background:#b7b7ce}.t-fairy{background:#d685ad}
</style>

<div class="wrap">
  <h1>⚔ <span>ポケモン対戦</span> ⚔</h1>
  <div class="sub">6体パーティを編成 → 見せ合い → シングル／ダブル／トリプル／6体バトル（交代・天候あり）</div>

  <div id="home">
    <div class="center" style="margin:12px 0"><button id="codeButton" class="btn blue" onclick="openDevCode()">🔐 コードを入力</button></div>
    <div class="center" id="partyProfileButtons" style="margin:8px 0"></div>
    <div class="grid" id="homeHero"></div>
    <div class="mode-menu">
    </div>
    <div class="menu">
      <button class="btn blue" onclick="show('train')">🎓 ポケモンを育成する（技・特性）</button>
      <button class="btn blue" onclick="openPartyBuilder('cpu')">🛠 パーティを編成する（6体）</button>
      <button class="btn" id="goBattle" onclick="startCpu()" disabled>⚔ CPUとたたかう（要：6体）</button>
      <button class="btn mega" onclick="startPokemonStadium()">🏟️ ポケモンスタジアム（ランダム3体・全5戦）</button>
      <span><button class="btn mega" onclick="startPokemonTower()">🏰 ポケモンタワー（最大999階）</button> <button class="btn ghost" style="padding:5px 8px" onclick="alert('999階クリアで激レアポケモン入手可能!?')">ℹ 詳細</button></span>
      <button class="btn ghost" onclick="resumePokemonTower()">💾 ポケモンタワーを再開</button>
      <button class="btn mega" onclick="startLunaticStage()"><img src="image/image/ザシアン.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ</button>
      <button class="btn mega" onclick="startLunaticStage2()"><img src="image/image/メガボーマンダ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ2</button>
      <button class="btn mega" onclick="startLunaticStage3()"><img src="image/image/メガヒードラン.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ3</button>
      <button class="btn mega" onclick="startLunaticStage4()"><img src="image/image/メガダークライ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ4</button>
      <button class="btn mega" onclick="startLunaticStage5()"><img src="image/image/メガレックウザ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ルナティックステージ5</button>
      <button class="btn mega" onclick="startDynamaxUnlockStage()"><img src="image/image/ムゲンダイナ.gif" style="width:24px;height:24px;vertical-align:middle;image-rendering:pixelated"> ダイマックス解放</button>
      <label class="sub">NPCレベル <select id="npcLevel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
      <button class="btn ghost" id="friendBattleButton" onclick="startFriendSetup()">👥 フレンドとたいせん（2人）</button>
      <button class="btn blue" onclick="startGroupBattle(2)">⚔ ダブルバトル（2体 vs 2体）</button>
      <button class="btn blue" onclick="startGroupBattle(3)">⚔ トリプルバトル（3体 vs 3体）</button>
      <button class="btn blue" onclick="startGroupBattle(6)">⚔ 6体バトル（6体 vs 6体）</button>
      <button class="btn ghost" onclick="showItemDex()">🎒 持ち物一覧</button>
      <button class="btn ghost" onclick="showPokemonDex()">📖 ポケモン一覧</button>
      <div class="sub" id="streakLabel">現在の連勝：0勝 ／ 最大連勝記録：0勝</div>
      <div class="sub" style="margin-top:14px">📖 ポケモン一覧</div>
      <div class="grid" id="homeDex"></div>
    </div>
  </div>

  <div id="train" class="hidden">
    <div class="sub">育成したいポケモンをえらんで、技(4つ)と特性をカスタマイズ（1Pとフレンドで別々に保存）</div>
    <div class="center" style="margin:10px 0 12px">
      <button class="btn blue" id="trainP1Btn" onclick="setTrainOwner('p1')">1Pを育成</button>
      <button class="btn ghost" id="trainP2Btn" onclick="setTrainOwner('p2')">フレンドを育成</button>
    </div>
    <div class="grid" id="trainGrid"></div>
    <div id="trainEdit" class="hidden"></div>
    <div class="center" style="margin-top:12px"><button class="btn ghost" onclick="show('home')">← もどる（保存）</button></div>
  </div>

  <div id="party" class="hidden">
    <div class="sub" id="partyTitle">使う6体をえらんで、各ポケモンの持ち物を設定（メガストーンでメガシンカ可能）</div>
    <div class="slots" id="partySlots"></div>
    <div class="grid" id="dexGrid"></div>
    <div class="center" id="partyNav" style="margin-top:12px"></div>
  </div>

  <div id="preview" class="hidden">
    <div class="sub" style="color:var(--accent)" id="previewTopLabel">あいてのパーティ（6体）</div>
    <div class="grid" id="foePreview"></div>
    <div class="sub" style="margin-top:14px" id="previewMyLabel">出す3体をえらんでください</div>
    <div class="grid" id="myPreview"></div>
    <div class="center" style="margin-top:12px">
      <button class="btn" id="startBtn" disabled>えらんだ3体で バトル！</button>
      <button class="btn ghost" onclick="show('home')">← もどる</button>
    </div>
  </div>

  <div id="battle" class="hidden">
    <div id="abilityToast" aria-live="polite"></div>
    <div class="field">
      <div class="weatherBadge hidden" id="weatherBadge"></div>
      <div class="towerBadge hidden" id="towerFloorBadge"></div>
      <div class="row"><div class="dots" id="foeDots"></div>
        <div class="mon" style="flex-direction:row-reverse">
          <img id="foeImg"><div class="info">
            <div class="nm"><span id="foeName"></span><span>Lv.50</span></div>
            <div class="ab" id="foeAb"></div><div class="stg" id="foeStg"></div>
            <div class="hpbar"><div class="hpfill" id="foeHp"></div></div>
            <div class="hpnum" id="foeHpNum"></div>
          </div></div>
      </div>
      <div class="row">
        <div class="mon"><img id="myImg"><div class="info">
            <div class="nm"><span id="myName"></span><span>Lv.50</span></div>
            <div class="ab" id="myAb"></div><div class="stg" id="myStg"></div>
            <div class="hpbar"><div class="hpfill" id="myHp"></div></div>
            <div class="hpnum" id="myHpNum"></div>
          </div></div>
        <div class="dots" id="myDots"></div>
      </div>
    </div>
    <div class="log" id="log"></div>
    <div class="cmd" id="cmd"></div>
    <div class="center hidden" id="endArea">
      <div class="result" id="resultTxt"></div>
      <button class="btn ghost" onclick="show('home')">メニューにもどる</button><button class="btn blue" onclick="startCpu()">🔁 連戦する</button><button class="btn mega hidden" id="towerResumeAfterLoss" onclick="resumePokemonTower()">🏰 セーブ地点から再開</button>
    </div>
  </div>
</div>

function moveEffText(mv){const t=[];if(mv.desc)t.push(mv.desc);if(mv.hpPower)t.push("残りHPで威力変化（最大150・最低10）");if(mv.accuracy)t.push(`命中${Math.round(mv.accuracy*100)}%`);if(mv.prio)t.push(`優先度+${mv.prio}`);if(mv.cut)t.push("切る技");if(mv.firstTurnOnly)t.push("出てすぐのターンのみ");if(mv.highCrit)t.push(`急所率${Math.round((mv.critRate||.125)*1000)/10}%`);if(mv.critMult)t.push(`急所ダメージ${mv.critMult}倍`);if(mv.flinch)t.push(`${Math.round(mv.flinch*100)}%で相手を行動不能`);if(mv.freeze)t.push(`${Math.round(mv.freeze*100)}%でこおり`);if(mv.burn)t.push(`${Math.round(mv.burn*100)}%でやけど`);if(mv.poison)t.push(`${Math.round(mv.poison*100)}%でどく`);if(mv.paralyze)t.push(`${Math.round(mv.paralyze*100)}%でまひ`);if(mv.spread)t.push("相手全体を攻撃（範囲ダメージ減衰なし）");if(mv.healDamage)t.push(`与えたダメージの${Math.round(mv.healDamage*100)}%回復`);if(mv.hypersleep)t.push("100%で超眠気（25%で行動不能・被ダメージ1.25倍）");if(mv.hazard==="rocks")t.push("交代で出た相手に最大HP1/10ダメージ");if(mv.hazard==="toxicspikes")t.push("交代してきた相手を毒にする。2回で猛毒");if(mv.hazard==="electroweb")t.push("交代してきた相手をまひ・でんき相性に応じた最大HPダメージ");if(mv.hazard==="stickyweb")t.push("交代して出た相手のすばやさを下げる");if(mv.selfBoost){const st=statEffectStats(mv.selfBoost),ch=statEffectChance(mv.selfBoost);t.push(`${ch<1?Math.round(ch*100)+"%で":""}自分の`+Object.keys(st).map(k=>STAT_JP[k]).join("・")+"↑");}if(mv.selfDrop)t.push("使用後 自分の"+Object.keys(mv.selfDrop).map(k=>STAT_JP[k]).join("・")+"↓");if(mv.targetDrop)t.push(`${Math.round(mv.targetDrop.chance*100)}%で相手の`+Object.keys(mv.targetDrop.stats).map(k=>STAT_JP[k]).join("・")+"↓");return t.join(" / ");}

  // ランダムに6体
  const pool=SPECIES.map((sp,i)=>sp.hidden||CODE_POKEMON_UNLOCKS[sp.id]?-1:i).filter(i=>i>=0);

function shuffled(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function normalSpeciesPool(){return SPECIES.map((sp,i)=>sp.hidden||CODE_POKEMON_UNLOCKS[sp.id]||sp.id==="kokugainoryu"?-1:i).filter(i=>i>=0);}
const STANDARD_CPU_ITEMS=["weakness","life","sitrus","orb","toxicorb","band","specs","sash","scarf","healcrown","powerband","cheatdice","firstbell","gritbelt","steadydice","eviolite"];
function randomBattleItem(sp,{megaChance=.8,itemChance=.9,legacyItems=false}={}){
  if(sp.megas?.length&&Math.random()<megaChance)return pickOne(sp.megas).stone;
  if(itemChance<1&&Math.random()>=itemChance)return "none";
  return pickOne(legacyItems?["none",...STANDARD_CPU_ITEMS]:STANDARD_CPU_ITEMS);
}
function randomBattleMoves(sp,plan="random"){
  const pool=(sp.learnset||sp.moves||[]).filter(k=>M[k]&&!M[k].fifthSlot);
  const preferred=sp.base.atk>=sp.base.spa?"phys":"spec", attacks=pool.filter(k=>M[k].cat===preferred), others=pool.filter(k=>M[k].cat!==preferred&&M[k].cat!=="status"), status=pool.filter(k=>M[k].cat==="status");

function calcDamage(attacker,defender,move,isCrit){
  if(attacker.itemKey==="mougekiScarf"||attacker.abilEff==="moldbreaker")move={...move,ignoreAbility:true};
  if(!move.ignoreAbility&&((defender.abilEff==="waterabsorb"&&move.type==="water")||(defender.abilEff==="levitate"&&move.type==="ground")||(defender.abilEff==="sapsipperSpa"&&move.type==="grass")||(defender.abilEff==="lightningrod"&&move.type==="electric")))return {dmg:0,eff:0,stab:false};
  if(move.cat==="status"||((move.chargedPower!==undefined?move.chargedPower:move.power)<=0)) return {dmg:0,eff:1,stab:false};
  if(attacker.itemKey!=="mougekiScarf"&&(move.ignoreAbility?null:defender.abilEff)==="disguise"&&!defender.usedDisguise)return {dmg:0,eff:0,stab:false,disguise:true};
  const skinType=attacker.abilEff==="aerilate"?"flying":attacker.abilEff==="dragonskin"?"dragon":null;
  const moveType=skinType&&move.type==="normal"?skinType:move.type;
  if(!move.ignoreAbility&&(((move.ignoreAbility?null:defender.abilEff)==="flashfire"&&moveType==="fire")||((move.ignoreAbility?null:defender.abilEff)==="magmaheat"&&moveType==="ground")||((move.ignoreAbility?null:defender.abilEff)==="eartheater"&&moveType==="ground"))) return {dmg:0,eff:0,stab:false};
  let atkStage=(move.cat==="spec")?attacker.stages.spa:attacker.stages.atk;
  let defStage=(move.cat==="spec")?defender.stages.spd:defender.stages.def;
  // シャドークローは相手の防御ランク上昇を無視する。
  if(move.ignoreDefBoost&&defStage>0)defStage=0;
  if(!move.ignoreAbility&&(move.ignoreAbility?null:defender.abilEff)==="unaware") atkStage=0;
  if(!move.ignoreAbility&&attacker.abilEff==="unaware") defStage=0;
  if(isCrit){ if(atkStage<0)atkStage=0; if(defStage>0)defStage=0; }
  let atkStat=((move.cat==="spec")?attacker.base.spa:(move.useDef?attacker.base.def:attacker.base.atk))*stageMult(move.useDef?attacker.stages.def:atkStage);
  if(move.cat==="phys"&&!move.useDef&&attacker.abilEff==="guts"&&attacker.status)atkStat*=1.5;
  if(attacker.abilEff==="morpekoHungry")atkStat*=1.2;
  let defStat=((move.cat==="spec")?defender.base.spd:defender.base.def)*stageMult(defStage);
  if(defender.abilEff==="morpekoFull")defStat*=1.2;
  if(move.cat==="phys"&&attacker.abilEff==="birdFlame")atkStat*=attacker.birdFlameMult||1;
  if(move.cat==="phys"&&!move.ignoreAbility&&(move.ignoreAbility?null:defender.abilEff)==="birdSnow"&&(defender.birdHail||["snow","hail","freeze","ひょうけつ","ゆき","あられ"].includes(weather)||defender.status==="freeze"))defStat*=1.5;
  if(move.cat==="spec")defStat*=defender.birdSpdMult||1;
  if(move.cat==="phys"&&defender.reflectTurns>0&&!isCrit)defStat*=2;
  if(defender.auroraVeilTurns>0&&defender.types.includes("ice"))defStat*=2;
  // 進化先がいるポケモンだけが、しんかのきせきの対象。メガシンカ前は対象外。
  const evioliteEligible=new Set(["chansey","porygon2","duraludon","joltik","scyther","clobbopus","dunsparce","snom"]);
  if(defender.itemKey==="eviolite"&&!defender.isMega&&evioliteEligible.has(defender.id))defStat*=1.5;
  if(defender.coachTurns>0&&(move.cat==="phys"||move.cat==="spec"))defStat*=1.2;
  if(defender.itemKey==="peacescroll"&&defender.peaceTurns>0)defStat*=3;
  if(move.lowDef){
    const physDef=defender.base.def*stageMult(defender.stages.def);
    const specDef=defender.base.spd*stageMult(defender.stages.spd);
    defStat=Math.min(physDef,specDef);
  }
  if(attacker.abilEff==="hugepower"&&move.cat==="phys") atkStat*=2;            // ちからもち
  if(attacker.itemKey==="powerband") atkStat*=1.05;
  if(attacker.abilEff==="supremeoverlord"){const team=attacker===me?myTeam:foeTeam;atkStat*=1+Math.min(5,team.filter(m=>m.fainted).length)*.1;}
  if(attacker.abilEff==="sheerforce"&&sheerForceBoosts(move)) atkStat*=1.3;    // ちからずく
  if(attacker.status==="burn"&&!attacker.safeBurn&&attacker.abilEff!=="guts"&&move.cat==="phys") atkStat*=0.5;                // やけど
  if(weather==="sand"&&defender.types.includes("rock")&&move.cat==="spec") defStat*=1.5; // 砂:いわ特防↑
  if(weather==="snow"&&defender.types.includes("ice")&&move.cat==="phys") defStat*=1.5;
  let stab=attacker.abilEff==="libero"?1.2:(attacker.types.includes(moveType)?1.3:1.0);
  if(attacker.isElectricTera&&moveType==="electric")stab=2.0;
  if(attacker.abilEff==="adaptability"&&stab>1) stab=2.0;
  // ふんか：残りHPの割合で威力が変化（最大150、最低10）
  let movePower=move.chargedPower!==undefined?move.chargedPower:(move.hpPower?Math.max(10,Math.floor(150*attacker.curHp/attacker.maxHp)):move.power);
  if(move.rageFist)movePower=Math.min(350,50+(attacker.rageFistHits||0)*50);
  if(move.electroBall&&!move.maxMove)movePower=electroBallPower(attacker,defender);
  if(move.noItemDouble&&(!attacker.itemKey||attacker.itemKey==="none"))movePower*=2;
  if(attacker.abilEff==="technician"&&movePower>0&&movePower<=60)movePower*=1.5;
  if(attacker.abilEff==="steelknight"&&movePower<=65) movePower*=1.5;
  if(move.removeItem&&defender.itemKey&&defender.itemKey!=="none")movePower*=1.5;
  if(attacker.abilEff==="hustle") movePower*=1.5;
  if(move.electricFieldDouble&&electricTurns>0) movePower*=2;
  if(move.statusPower&&defender.status) movePower*=move.statusPower;
  if(move.faintBonus){const team=attacker===me?myTeam:foeTeam;movePower=Math.min(move.maxPower||movePower,movePower+team.filter(m=>m.fainted).length*move.faintBonus);}
  if(move.firstStrike&&!defender.turnMoved)movePower*=2;
  if(move.blackMoon&&defender.justSwitched)movePower*=1.8;
  if(move.kokugaiBreath&&attacker.kokugaiBreathDoubleTurns===1)movePower*=2;
  if(move.magicGamma)movePower+=(move.magicSpend||0)*5;
  if(attacker.abilEff==="magicGauge"&&move.magicSpend>0)movePower*=1+Math.min(100,move.magicSpend)/100;
  let attack=atkStat*stab*movePower, defense=defender.base.hp*defStat;
  let dmg=(attack/defense)*42;
  const typeEff=effMultiplier(moveType,defender.types);
  const rawEff=move.waterSuper&&defender.types.includes("water")?2:(attacker.itemKey==="mougekiScarf"&&typeEff===0?1:typeEff);
  const eff=move.fairyBypass&&defender.types.includes("fairy")?2:(move.ignoreType?1:rawEff); dmg*=eff;
  if(defender.frozenGlaiveVulnerableTurns>0)dmg*=2;
  // ルナティックステージ2のメガボーマンダは弱点ダメージを4/3倍に抑える
  if((defender.lunatic2Boss||defender.lunatic3Boss)&&eff>1) dmg*=((4/3)/eff);
  // 天候によるタイプ補正
  if(weather==="rain"){ if(moveType==="water")dmg*=1.3; else if(moveType==="fire")dmg*=0.5; }
  else if(weather==="sun"){ if(moveType==="fire")dmg*=1.5; else if(moveType==="water")dmg*=0.5; }
  if(attacker.abilEff==="sunpower"&&weather==="sun"&&move.cat==="spec") dmg*=1.5;
  // ピンチ特性（HP1/3以下）
  const low=attacker.curHp<=attacker.maxHp/3;
  if(low&&attacker.abilEff==="overgrow"&&moveType==="grass")dmg*=1.5;

  // メガボーマンダ／メガオーダイルのすてみタックルは専用強化

function chooseSwitch(side,i){
  const mon=activeOf(side);
  if(mon.switchLock>0){ pushLog(`  ・ ${mon.name} は ${mon.switchLock}ターン交代できない！`,"#ff7043"); renderMenu(side); return; }

function submitAction(side,action){
  // 味方対象技は、シングルでも本体・ヘイを含めて対象を明示的に選択する。
  if(action.type==="move"&&isAllyTargetMove(action.move)&&!action.allyTargetReady){
    pendingAllyTarget={side,action};
    document.getElementById("cmd").innerHTML='<div>味方の対象を選択</div>'+friendlyTargets(side).map((m,i)=>`<button class="btn ghost" onclick="confirmAllyTarget(${i})">${m.name} (${m.curHp}/${m.maxHp})</button>`).join('')+'<div class="center"><button class="btn ghost" onclick="openMoves(\''+side+'\')">← もどる</button></div>';
    return;
  }
  if(action.type==="move"&&!action.targetReady&&selectableTargets(side,action.move).length>1){
    pendingTarget={side,action};
    document.getElementById("cmd").innerHTML=`<div>攻撃対象を選択${canLongReachBench(activeOf(side),action.move)?'（控えは威力30%上昇）':''}</div>`+selectableTargets(side,action.move).map((m,i)=>`<button class="btn ghost" onclick="confirmAttackTarget(${i})">${m.name}${m.isBanetteShadow||m.shadowTargets?'':` (${m.curHp}/${m.maxHp})`}</button>`).join('');return;
  }
  if(action.type==="move"&&!action.heiReady){openHeiActions(side,action);return;}
  // 技オブジェクトを共有参照しない。片側の選択・変化技処理がもう片側へ伝播しないようにする。
  turnAct[side]=action&&action.type==="move"?Object.assign({},action,{move:Object.assign({},action.move)}):action; clearCmd();
  if(side==="me"){
    if(isCpuMode()){ turnAct.foe=cpuChoose(); doResolve(); }
    else handoff("foe");
  }else doResolve();
}
let pendingTarget=null;
let pendingAllyTarget=null;
function isAllyTargetMove(move){return !!(move&&(move.allyHeal||move.allyBoost||move.decorateAlly));}
function friendlyTargets(side){const host=activeOf(side);return [host,...(host.heis||[])].filter(m=>!m.fainted&&m.curHp>0);}
function confirmAllyTarget(index){
  const p=pendingAllyTarget;if(!p)return;
  const target=friendlyTargets(p.side)[index];if(!target)return;
  pendingAllyTarget=null;
  p.action.allyTargetReady=true;
  p.action.move=Object.assign({},p.action.move,{allyTarget:target});
  submitAction(p.side,p.action);
}
function enemyTargets(side){const host=activeOf(side==="me"?"foe":"me");if(host.shadowTargets&&host.shadowTargets.some(m=>!m.fainted&&m.curHp>0))return host.shadowTargets.filter(m=>!m.fainted&&m.curHp>0);return [host,...(host.heis||[])].filter(m=>!m.fainted&&m.curHp>0);}
function benchTargets(side){if(typeof multi!=="undefined"&&multi)return multiBench(side==="me"?"foe":"me");const enemySide=side==="me"?"foe":"me";return teamOf(enemySide).filter((m,i)=>i!==activeIdxOf(enemySide)&&!m.fainted&&m.curHp>0);}
function canLongReachBench(attacker,move){return !!(attacker&&attacker.abilEff==="longreach"&&move&&move.name==="かげぬい");}
function selectableTargets(side,move){const front=enemyTargets(side),attacker=activeOf(side);return canLongReachBench(attacker,move)?[...front,...benchTargets(side)]:front;}
function resolveAttackTarget(side,target,move){const list=selectableTargets(side,move);return list.includes(target)?target:list[0]||activeOf(side==="me"?"foe":"me");}
function confirmAttackTarget(i){const {side,action}=pendingTarget,target=selectableTargets(side,action.move)[i];if(!target)return;pendingTarget=null;action.target=target;action.targetReady=true;if(canLongReachBench(activeOf(side),action.move)&&benchTargets(side).includes(target))action.move=Object.assign({},action.move,{longReachBench:true});submitAction(side,action);}
function isFriendlyMove(move){return !!(move.birdShield||move.heiCare||move.heiCoaching||move.allyHeal||move.allyBoost||move.holeCake||move.selfBoost&&move.cat==="status"||move.recover||move.roost||move.protect||move.substitute);}
function handoff(side){
  const c=document.getElementById("cmd");
  c.innerHTML=`<div class="center" style="margin:10px 0">
    <div class="sub">${sideLabel(side)} に かわってください</div>
    <button class="btn blue" onclick="requestAction('${side}')">▶ ${sideLabel(side)} の ばん</button></div>`;

// ===== ターン解決 =====
function series(tasks,done){let i=0;const nx=()=>{ if(i>=tasks.length){done();return;} tasks[i++](nx); };nx();}
function doResolve(){
  [...myTeam,...foeTeam].forEach(mon=>{mon.careCritGuard=!!mon.careCritGuardPending;mon.careCritGuardPending=false;});
  busy=true; clearCmd();
  [...myTeam,...foeTeam].forEach(m=>{m.protectActive=false;m.kingShieldActive=false;m.wideGuardActive=false;});
  me.turnMoved=false; foe.turnMoved=false; me.hitBeforeMove=false; foe.hitBeforeMove=false; me.flinched=false; foe.flinched=false;
  const A=turnAct.me, B=turnAct.foe;
  const phaseSwitch=(next)=>{const t=[];
    if(A.type==="switch") t.push(cb=>doSwitch("me",A.idx,cb));
    if(B.type==="switch") t.push(cb=>doSwitch("foe",B.idx,cb));
    series(t,next);};
  const phaseTera=(next)=>{const t=[];[["me",me,"myImg",A],["foe",foe,"foeImg",B]].forEach(([side,mon,img,action])=>{if(action.type==="move"&&teraArm[side]&&mon.id==="nemoPawmot"&&!teraUsed[side]){teraArm[side]=false;teraUsed[side]=true;t.push(cb=>doElectricTera(mon,img,cb));}});series(t,next);};
  const phaseMega=(next)=>{const t=[];
    if(!rayMegaActive&&A.type==="move"&&megaArm.me&&((me.stoneMatches&&!me.isMega)||(canRayMega(me)))){megaArm.me=false;t.push(cb=>doMega(me,"myImg",cb));}
    const cpuRainMega=(mode==='cpu'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock')&&B.type==="switch"&&foe.id==="ragulaaji"&&weather==="rain";
    if(!rayMegaActive&&foe.stoneMatches&&!foe.isMega&&((mode==='cpu'||mode==='stadium'||mode==='tower'||mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock')||megaArm.foe||cpuRainMega)){megaArm.foe=false;t.push(cb=>doMega(foe,"foeImg",cb));}
    series(t,next);};
  const phaseMax=(next)=>{const t=[];
    if(!rayMegaActive&&A.type==="move"&&maxArm.me&&!me.isDynamax&&me.id!=="zacian"&&me.id!=="eternatus"&&(!me.isMega||GMAX_IDS.has(me.id))){maxArm.me=false;t.push(cb=>doDynamax(me,"myImg",cb));}
    if(!rayMegaActive&&B.type==="move"&&maxArm.foe&&!foe.isDynamax&&foe.id!=="zacian"&&foe.id!=="eternatus"&&(!foe.isMega||GMAX_IDS.has(foe.id))){maxArm.foe=false;t.push(cb=>doDynamax(foe,"foeImg",cb));}
    series(t,next);
  };
  const phaseAttack=(next)=>{
    const movers=[];
    if(A.type==="move") movers.push({who:"me",move:A.move,target:A.target,part:A.part||"waist",mon:me});
    if(B.type==="move") movers.push({who:"foe",move:B.move,target:B.target,part:B.part||"waist",mon:foe});
    if(me.ritualTurns>0&&!me.fainted)movers.push({who:"me",move:M.ritualTick,part:"waist",mon:me,ritualExtra:true});
    if(foe.ritualTurns>0&&!foe.fainted)movers.push({who:"foe",move:M.ritualTick,part:"waist",mon:foe,ritualExtra:true});
    const addHeiMovers=(side,action,host)=>{
      if(!action||action.type!=="move"||!host.heis)return;
      host.heis.filter(h=>!h.fainted).forEach(h=>{
        const selected=action.heiMoves?.find(x=>x.name===h.name);
        h.turnMoved=false;h.flinched=false;h.protectActive=false;
        movers.push({who:side,move:selected?M[selected.key]:h.moves[0],target:selected?.target,part:"waist",mon:h,host,hei:true});
      });
    };
    addHeiMovers("me",A,me); addHeiMovers("foe",B,foe);
    movers.forEach(m=>{m.mon.quickDraw=false;if(m.mon.abilEff==="quickdraw"&&Math.random()<.2){m.mon.quickDraw=true;pushLog(`  ★ ${m.mon.name} の クイックドロウ！ 優先度が上がった！`,"#ffcb05");} });
    movers.sort((a,b)=>{
      const pa=movePriority(a.mon,a.move), pb=movePriority(b.mon,b.move);
      if(pa!==pb) return pb-pa;
      // 優先度が同じなら、実数値の高い方を必ず先に行動させる
      return effSpeed(b.mon)-effSpeed(a.mon);
    });
    runAttacks(movers,0,next);

  phaseSwitch(()=>phaseMax(()=>phaseTera(()=>phaseMega(()=>phaseAttack(()=>endTurn())))));

function runAttacks(movers,i,done){
  if(i>=movers.length){done();return;}
  const m=movers[i], atk=m.hei?m.mon:activeOf(m.who), def=resolveAttackTarget(m.who,m.target,m.move), defImg=m.who==="me"?"foeImg":"myImg";
  if(!m.hei&&atk!==m.mon){ runAttacks(movers,i+1,done); return; }
  if(m.hei&&activeOf(m.who)!==m.host){ runAttacks(movers,i+1,done); return; }
  if(atk.fainted){ runAttacks(movers,i+1,done); return; }
  if(atk.holeCakeTurns>0){setTimeout(()=>{pushLog(`  └ ${atk.name} は ホールケイプ中で 動けない！`,"#ffcb05");runAttacks(movers,i+1,done);},250);return;}
  if(def.fainted&&!isFriendlyMove(m.move)){ runAttacks(movers,i+1,done); return; }
  if(atk.outrageTurns>0) m.move=atk.outrageMove||M.outrage;
  // エレクトロビームをためた次のターンは、別の技を選んでも発射する。
  if(atk.electroBeamReady) m.move=M.electrobeam;
  m.move=Object.assign({},m.move,{targetPart:m.part||"waist"});
  if(atk===foe)atk.lastMoveWasStatus=m.move.cat==="status";
  if(atk.flinched&&atk.abilEff!=="focus"){ atk.flinched=false; atk.firstTurnReady=false; setTimeout(()=>{pushLog(`  └ ${atk.name} は ひるんで 動けない！`,"#ffcb05");runAttacks(movers,i+1,done);},450); return; }
  if(atk.confusionTurns>0){
    atk.confusionTurns--;renderStages();
    if(Math.random()<1/3){atk.firstTurnReady=false;setTimeout(()=>{pushLog(`  └ ${atk.name} は 混乱して動けない！`,"#b061ff");runAttacks(movers,i+1,done);},450);return;}
  }
  if(atk.status==="freeze"){
    if(atk.alolanFreezeTurns>0){atk.alolanFreezeTurns--;atk.status=null;renderStages();setTimeout(()=>{pushLog(`  └ ${atk.name} は アローラキュウコンの ふぶきで こおって動けない！`,"#9fb3d6");runAttacks(movers,i+1,done);},450);return;}
    if(Math.random()<0.25){ atk.status=null; renderStages(); pushLog(`  └ ${atk.name} の こおりが とけた！`,"#7ad1ff"); }
    else { atk.firstTurnReady=false; setTimeout(()=>{pushLog(`  └ ${atk.name} は こおって 動けない！`,"#9fb3d6");runAttacks(movers,i+1,done);},450); return; }
  }
  if(atk.status==="paralyze"&&Math.random()<0.2){
    atk.firstTurnReady=false;
    setTimeout(()=>{pushLog(`  └ ${atk.name} は しびれて 動けない！`,"#ffcb05");runAttacks(movers,i+1,done);},450);
    return;
  }
  if(atk.status==="sleep"){
    atk.sleepTurns--;
    if(atk.sleepTurns<=0){atk.status=null;pushLog(`  └ ${atk.name} は ねむりから 起きた！`);}
    else {setTimeout(()=>{pushLog(`  └ ${atk.name} は ぐうぐう ねむっている！`,"#9fb3d6");runAttacks(movers,i+1,done);},450);return;}
  }
  if(atk.status==="hypersleep"&&Math.random()<.25){
    setTimeout(()=>{pushLog(`  └ ${atk.name} は 超眠気で 動けない！`,"#9fb3d6");runAttacks(movers,i+1,done);},450);return;
  }
  atk.turnMoved=true;
  const defSide=m.who==="me"?"foe":"me";
  if(m.move.requiresAttack&&(!turnAct[defSide]||turnAct[defSide].type!=="move"||turnAct[defSide].move.cat==="status"||turnAct[defSide].move.power<=0)){
    pushLog(`  └ ${atk.name} の ふいうちは しっぱいした！`,"#9fb3d6");
    runAttacks(movers,i+1,done); return;
  }
  if(m.move.requiresStatus&&(!turnAct[defSide]||turnAct[defSide].type!=="move"||turnAct[defSide].move.cat!=="status")){
    pushLog(`  └ ${atk.name} の ふいうちは しっぱいした！`,"#9fb3d6");runAttacks(movers,i+1,done);return;
  }

    renderHeis();

    ["me","foe"].forEach(side=>(activeOf(side).heis||[]).forEach(h=>{
      if(h.fainted||movers.some(x=>x.mon===h))return;
      const choice=turnAct[side]?.heiMoves?.find(x=>x.name===h.name);

    });
  });
}
function applyMoveRecoil(attacker,move,actualDamage){
  if(!move.recoilDamage||actualDamage<=0||attacker.abilEff==="damp"||attacker.abilEff==="rockhead"||attacker.curHp<=0) return;
  const recoil=Math.max(1,Math.floor(actualDamage*move.recoilDamage*(attacker.abilEff==="schooling"?.5:1)));
  attacker.curHp=Math.max(0,attacker.curHp-recoil);
  renderHp();
  pushLog(`  └ ${attacker.name} は反動で ${recoil} ダメージ！`,"#ff7043");
  if(attacker.curHp<=0&&!attacker.fainted) faintMon(attacker,attacker===me?"myImg":"foeImg");
}
function birdSide(mon){
  if(typeof multi!=="undefined"&&multi)return multi.teams.me.includes(mon)?"me":"foe";
  return mon===me||mon.host===me||myTeam.includes(mon)?"me":"foe";
}
function birdAllies(mon){
  const side=birdSide(mon);
  if(typeof multi!=="undefined"&&multi)return multiLiving(side);
  const host=side==="me"?me:foe;
  return [host,...(host.heis||[])].filter(m=>m&&!m.fainted);
}
function birdImage(mon){return typeof multi!=="undefined"&&multi?multiImage(mon):mon===me?"myImg":"foeImg";}
function absorbIceShield(mon,damage){
  const blocked=Math.min(mon.iceShieldHp,damage);
  mon.iceShieldHp=Math.max(0,mon.iceShieldHp-damage);
  pushLog(`  ❄ ${mon.name} の氷塊シールドが ${blocked} ダメージを防いだ！ 残り${mon.iceShieldHp}`,"#7ad1ff");
  if(!mon.iceShieldHp)pushLog(`  └ ${mon.name} の氷塊シールドが壊れた！ 本体への超過ダメージなし。`,"#7ad1ff");
}
function absorbBlackMoonShield(mon,damage){const blocked=Math.min(mon.blackMoonShieldHp,damage),overflow=Math.max(0,damage-blocked);mon.blackMoonShieldHp=Math.max(0,mon.blackMoonShieldHp-damage);const label=mon.sayakuShield?"シールド":"月影シールド";pushLog(`  🛡 ${mon.name} の${label}が ${blocked} ダメージを防いだ！ 残り${mon.blackMoonShieldHp}`,"#7ad1ff");if(mon.sayakuShield&&overflow>0){mon.curHp=Math.max(0,mon.curHp-overflow);pushLog(`  └ シールドを超えた ${overflow} ダメージを受けた！`,"#ff7043");}return overflow;}
function birdContact(attacker,defender,move,damage){
  if(move.cat==="status")return;
  for(const mon of [attacker,defender])if(mon.abilEff==="birdFlame"&&!(mon===defender&&move.ignoreAbility)){
    announceAbility(mon);
    mon.birdFlameMult=Math.min(2,(mon.birdFlameMult||1)*1.1);
    pushLog(`  ★ ${mon.name} のほのおのからだ！ 攻撃×${mon.birdFlameMult.toFixed(2)}`,"#ff7043");
  }
  if(defender.abilEff==="birdStatic"&&!move.ignoreAbility&&Math.random()<.5){
    announceAbility(defender);
    if(!attacker.fainted&&attacker.curHp>0)applyStatus(attacker,"paralyze",defender);
    defender.birdNextSure=true;
    pushLog(`  ★ ${defender.name} のせいでんき！ 次の技が必中！`,"#f8d030");
  }
  if(defender.birdHail&&damage>0&&attacker.curHp>0){
    const reflected=Math.max(1,Math.floor(damage/8));
    if(attacker.iceShieldHp>0)absorbIceShield(attacker,reflected);
    else attacker.curHp=Math.max(0,attacker.curHp-reflected);
    pushLog(`  ❄ あられ状態で ${attacker.name} に ${reflected} ダメージ反射！`,"#7ad1ff");

function birdAttack(attacker,defender,move,defImgId,cb){
  if(attacker.rechargeTurns>0){attack(attacker,defender,{...move,birdResolved:true},defImgId,cb);return;}
  if(move.onceBattle&&attacker[move.onceFlag]){pushLog(`  └ ${move.name} は1試合に1回だけ！`);cb();return;}
  if(move.onceBattle)attacker[move.onceFlag]=true;
  const sure=attacker.birdNextSure||attacker.birdSureTurns>0;
  attacker.birdNextSure=false;
  if(move.birdShield){
    const shield=Math.floor(attacker.maxHp*1.5);
    birdAllies(attacker).forEach(m=>{m.iceShieldHp=shield;});
    attacker.acted++;attacker.firstTurnReady=false;
    pushLog(`${attacker.name} の ${move.name}！ 自分と味方に耐久${shield}の氷塊シールド！`,"#7ad1ff");renderHp();cb();return;
  }
  const actual=maxMoveFor(attacker,move);

function summonFalinksHeis(mon){
  if(!mon||mon.id!=="falinks"||mon.isMega)return false;
  if(mon.beatupUses>=3){pushLog(`  └ ${mon.name} の ふくろだたきは もう使えない！`,"#9fb3d6");return false;}
  const pool=FALINKS_HEI.filter(h=>!(mon.beatupSummoned||[]).includes(h.name));
  const count=mon.beatupUses<2?2:1, picked=(mon.pendingHeis||pool.map(h=>h.name)).map(name=>pool.find(h=>h.name===name)).filter(Boolean).slice(0,count);
  mon.pendingHeis=null;
  mon.heis=mon.heis||[];
  picked.forEach(h=>{
    const hei=makeMon(SP_BY_ID.falinks,"none","cpu");
    Object.assign(hei,{id:"hei",name:h.name,img:"image/image/タイレーツのヘイ.gif",base:{...h.base},abilEff:h.abil,abilName:ABIL[h.abil].name,moves:h.moves.map(k=>M[k]),isHei:true,host:mon});
    hei.maxHp=Math.floor((h.base.hp*2*LEVEL/100+LEVEL+10)*1.5);hei.curHp=hei.maxHp;
    const entry=(mon===me?party:party2).find(p=>p.sp===SP_BY_ID.falinks);
    hei.itemKey=entry?.heiItems?.[h.name]||"none";
    mon.heis.push(hei);
    if(h.abil==="intimidate")applyDrop(mon===me?foe:me,{atk:-1});
  });
  mon.beatupSummoned=(mon.beatupSummoned||[]).concat(picked.map(h=>h.name)); mon.beatupUses++;
  const place=mon.beatupUses===1?"右":mon.beatupUses===2?"左":"上";
  pushLog(`  ★ ふくろだたき！ ${place}に ${picked.map(h=>h.name).join("・")} が登場！（${picked.map(h=>h.base.hp+"HP").join("／")}）`,"#ffcb05");
  renderHeis();
  return true;
}
let heiInput=null;

function openHeiActions(side,action){

    const available=FALINKS_HEI.filter(h=>!(mon.beatupSummoned||[]).includes(h.name));
    document.getElementById("cmd").innerHTML=`<div>呼び出すヘイを${Math.min(2,available.length)}体選択</div>`+available.map(h=>`<button class="btn ghost" onclick="pickHei('${h.name}',this)">${h.name}</button>`).join("");

function pickHei(name,button){
  if(heiInput.picks.includes(name))return;

function chooseHeiMoves(){
  const {side,action}=heiInput,mon=activeOf(side);

    const moveKeys=h.moves.map(move=>typeof move==="string"?move:Object.keys(M).find(k=>M[k]===move)).filter(k=>M[k]);
    return `<div>${name}<select id="heiMove${i}">${moveKeys.map(k=>`<option value="${k}">${M[k].name}</option>`).join("")}</select><select id="heiTarget${i}">${enemyTargets(side).map((t,j)=>`<option value="${j}">${t.name}</option>`).join("")}</select></div>`;
  }).join("")+`<button class="btn" onclick="confirmHeiMoves()">決定</button>`;

function confirmHeiMoves(){
  const {side,action,names}=heiInput;
  const moves=names.map((name,i)=>({name,key:document.getElementById("heiMove"+i).value,target:enemyTargets(side)[Number(document.getElementById("heiTarget"+i).value)]}));
  if(moves.filter(m=>m.key==="heicare").length>2){alert("かいごは同じターンに2回までです。");return;}
  action.heiMoves=moves;action.heiReady=true;
  submitAction(side,action);

function runHeiActions(done){
  const tasks=[];
  ["me","foe"].forEach(side=>{
    const mon=activeOf(side),target=activeOf(side==="me"?"foe":"me");
    if(mon.fainted||mon.isMega)return;
    (mon.heis||[]).forEach(h=>{
      const choice=turnAct[side]?.heiMoves?.find(x=>x.name===h.name);
      const move=choice?M[choice.key]:h.moves[0];
      tasks.push(cb=>{
        if(h.fainted||target.fainted){cb();return;}
        attack(h,target,move,imgOf(side==="me"?"foe":"me"),()=>{renderHeis();cb();});
      });
    });
  });
  series(tasks,done);
}
function canStatus(mon,status,source){
  if(mon.sayakuShield&&mon.blackMoonShieldHp>0)return false;
  if(mon.abilEff==="purifyingSalt"&&source?.abilEff!=="moldbreaker"){announceAbility(mon);return false;}
  if(mon.status) return false;
  if(status==="burn"&&(mon.types.includes("fire")||mon.abilEff==="waterbubble")) return false;
  if(status==="freeze"&&mon.types.includes("ice")) return false;
  if((status==="poison"||status==="toxic")&&(mon.types.includes("poison")||mon.types.includes("steel"))&&(!source||source.abilEff!=="corrosion")) return false;
  return true;
}

function applyHazards(side,cb){
  const mon=activeOf(side), h=hazards[side], tasks=[];
  if(mon.fainted){ cb(); return; }
  if(mon.itemKey==="boots"){ cb(); return; }
  if(h.rocks>0) tasks.push(next=>setTimeout(()=>{applyStealthRockResidual(side,mon,imgOf(side));next();},350));
  if(h.spikes>0&&!mon.types.includes("flying")&&mon.abilEff!=="levitate") tasks.push(next=>setTimeout(()=>{
    const denom=[16,8,4,2][Math.min(h.spikes-1,3)];

    mon.curHp=Math.max(0,mon.curHp-d);

  },350));

    next();
  },300));
  if(h.electroweb) tasks.push(next=>setTimeout(()=>{
    if(mon.fainted){next();return;}
    const eff=effMultiplier("electric",mon.types);
    if(eff===0||mon.abilEff==="levitate"){
      pushLog(`  ⚡ ${mon.name} には エレキネットが 効かない！`,"#9fb3d6");
      next(); return;
    }
    const ratio=Math.max(1/24,Math.min(1/2,eff/8));
    const d=Math.max(1,Math.floor(mon.maxHp*ratio));
    mon.curHp=Math.max(0,mon.curHp-d); renderHp();
    pushLog(`  ⚡ ${mon.name} は エレキネットで ${d} ダメージ！`,"#f8d030");
    applyStatus(mon,"paralyze",h.electrowebSetter);
    if(mon.curHp<=0) faintMon(mon,imgOf(side));
    next();
  },350));
  if(h.stickyweb) tasks.push(next=>setTimeout(()=>{
    if(!mon.fainted){
      applyDrop(mon,{spe:-1});
      pushLog(`  🕸 ${mon.name} は ねばねばネットで すばやさが 下がった！`,"#9bc53d");
    }
    next();
  },300));
  if(!tasks.length) cb(); else series(tasks,cb);
}

// ===== CPU思考 =====
function cpuChoose(){
  if(foe.itemKey==="mougekiScarf"&&foe.mougekiLock){const move=foe.moves.find(m=>m.name===foe.mougekiLock);if(move)return {type:"move",move};}
  if(mode==='tower'&&towerRun?.floor===999&&me.justSwitched&&Math.random()<.30){
    const weakMove=foe.moves.filter(mv=>mv.cat!=="status"&&effMultiplier(mv.type,me.types)>1).sort((a,b)=>calcDamage(foe,me,b,false).dmg-calcDamage(foe,me,a,false).dmg)[0];
    if(weakMove)return {type:"move",move:weakMove};
  }
  if(mode==='lunatic'&&foe.id==='hippowdon'&&foe.acted===0&&Math.random()<.70) return {type:"move",move:M.stealthrock};
  if(mode==='lunatic'&&foe.id==='cinderace'&&foe.curHp<=foe.maxHp*.2&&Math.random()<.85) return {type:"move",move:M.suckerpunch};
  // ペリッパー先発→雨が降ったらラグラージに交代
  if(foe.id==="pelipper"&&foe.acted>=1&&weather==="rain"){
    const ri=foeTeam.findIndex(m=>m.id==="ragulaaji"&&!m.fainted);
    if(ri>=0&&ri!==foeA) return {type:"switch",idx:ri};
  }
  let cand=foe.moves.filter(mv=>!(mv.firstTurnOnly&&(foe.acted||0)>0)&&!(psychicTurns>0&&mv.prio>0)&&!(mv.onceBattle&&foe[mv.onceFlag||"usedPlayTogether"])&&!(mv.fifthSlot&&foe.usedFifthSlot)&&!(mv.ritual&&foe.usedRitual));
  if(!cand.length)cand=foe.moves;
  const valid=cand.filter(mv=>mv.cat==="status"||calcDamage(foe,me,mv,false).eff!==0);
  if(valid.length)cand=valid;
  if(npcLevel>=10){
    const preferred=foe.base.spa>=foe.base.atk?"spec":"phys";
    const typed=cand.filter(mv=>mv.cat==="status"||mv.cat===preferred);
    if(typed.length)cand=typed;
  }
  // 攻撃技がある場合、つるぎのまい等の自己強化だけを連続選択しない。
  const attackable=cand.filter(mv=>mv.cat!=="status"&&mv.power>0&&calcDamage(foe,me,mv,false).eff!==0);
  if(foe.lastMoveWasStatus&&attackable.length)cand=attackable;
  if(attackable.length)cand=cand.filter(mv=>mv.cat!=="status"||!mv.selfBoost);
  const weak=cand.filter(mv=>calcDamage(foe,me,mv,false).eff>1);
  if(mode==='lunatic'||mode==='lunatic2'||mode==='lunatic3'||mode==='lunatic4'||mode==='lunatic5'||mode==='dynamaxUnlock'){
    let best=cand[0],bs=-1;
    for(const mv of cand){
      const hit=mv.accuracy||1, eff=effMultiplier(mv.type,me.types);
      const score=calcDamage(foe,me,mv,false).dmg*hit*(eff>1?1.25:1);
      if(score>bs){bs=score;best=mv;}
    }
    return {type:"move",move:best};
  }
  if(weak.length&&Math.random()<.30) return {type:"move",move:pickOne(weak)};
  if(Math.random()<Math.max(.02,.18-npcLevel*.025)) return {type:"move",move:cand[Math.floor(Math.random()*cand.length)]};
  let best=cand[0],bd=-1;
  for(const mv of cand){const d=calcDamage(foe,me,mv,false).dmg;if(d>bd){bd=d;best=mv;}}
  return {type:"move",move:best};
}
function cpuForcedSwitch(){
  const alive=foeTeam.map((m,i)=>i).filter(i=>!foeTeam[i].fainted&&i!==foeA);
  if(!alive.length) return -1;
  // 一番ダメージを通せる相手を選ぶ
  let best=alive[0],bs=-1;
  for(const i of alive){let mx=0;for(const mv of foeTeam[i].moves){const d=calcDamage(foeTeam[i],me,mv,false).dmg*effMultiplier(mv.type,me.types?me.types:[]);if(d>mx)mx=d;}if(mx>bs){bs=mx;best=i;}}
  return best;
}

    d=Math.max(d,Math.max(1,Math.floor(mon.maxHp/mon.trapDenom)));
    label=mon.trapLabel||"マグマストームの熱";
    color=mon.trapColor||"#ff7043";
  }
  if(mon.salted){d=Math.max(1,Math.floor(mon.maxHp/(mon.types.includes("steel")||mon.types.includes("water")?4:8)));label="しおづけ";color="#7ad1ff";}
  if(mon.leechSource&&!mon.fainted){const h=Math.max(1,Math.floor(mon.maxHp/8*constantDamageFactor(mon)));mon.curHp=Math.max(0,mon.curHp-h);if(mon.leechSource&&!mon.leechSource.fainted)mon.leechSource.curHp=Math.min(mon.leechSource.maxHp,mon.leechSource.curHp+h);renderHp();pushLog(`  ・ ${mon.name} はヤドリギで ${h} ダメージ！`,"#7ad1ff");}
  if(d>0)d=Math.max(1,Math.floor(d*constantDamageFactor(mon)));
  if(d){
    if(mon.iceShieldHp>0){absorbIceShield(mon,d);d=0;}
    mon.curHp=Math.max(0,mon.curHp-d);
    if(mon.trapTurns>0) mon.trapTurns--;
    renderHp();
    pushLog(`  ・ ${mon.name} は ${label}で ${d} ダメージ！`,color);
    if(mon.curHp<=0) faintMon(mon,imgId);
  }
  if(mon.sweetAromaTurns>0&&!mon.fainted){
    const sweet=Math.max(1,Math.floor(mon.maxHp*.10));
    mon.curHp=Math.max(0,mon.curHp-sweet);mon.sweetAromaTurns--;renderHp();
    pushLog(`  ・ ${mon.name} は あまいかおりで ${sweet} ダメージ！`,"#ffcb05");
    if(mon.curHp<=0)faintMon(mon,imgId);
  }
}
function applyHoleCake(allies){
  const caster=allies.find(m=>m&&!m.fainted&&m.holeCakeTurns>0);
  if(!caster)return;
  allies.filter(m=>m&&!m.fainted).forEach(m=>{
    const h=Math.max(1,Math.floor(m.maxHp*.50));
    m.curHp=Math.min(m.maxHp,m.curHp+h);
    m.alcremieShieldHp=Math.max(1,Math.floor(m.maxHp*.25));
    pushLog(`  🍰 ${m.name} は マルホイップで HP${h}回復・最大HP1/4のシールド！`,"#ffcb05");
  });
  caster.holeCakeTurns--;
  if(caster.holeCakeTurns===0)pushLog(`  ・ ${caster.name} の ホールケイプが 終わった！`,"#ffcb05");
  renderHp();renderStages();
}
function applyStealthRockResidual(side,mon,imgId){
  const h=hazards[side];
  if(!mon||mon.fainted||!h||h.rocks<=0)return;
  const source=h.rocksSetter||mon;
  const base=calcDamage(source,mon,M.stealthrockTick,false).dmg;
  const d=Math.max(1,base*h.rocks)+Math.max(1,Math.floor(mon.maxHp*.05*h.rocks));
  mon.curHp=Math.max(0,mon.curHp-d);
  renderHp();
  pushLog(`  ▲ ${mon.name} は ステルスロック（${h.rocks}回）で ${d} ダメージ！`,"#b6a136");
  if(mon.curHp<=0)faintMon(mon,imgId);
}
function cpuForceReplace(cb){
  const ni=cpuForcedSwitch();
  if(ni<0) return finish(true);
  doSwitch("foe",ni,()=>{
    if(foe.fainted){
      if(!foeTeam.some(m=>!m.fainted)) finish(true);
      else cpuForceReplace(cb);
    }else cb();
  });
}
function clearTrevenantLinks(mon){
  if(!mon)return;
  mon.painSplitSource=null;mon.painSplitTurns=0;mon.trevenantCurseSource=null;
  [...myTeam,...foeTeam].forEach(other=>{
    if(other.painSplitSource===mon){other.painSplitSource=null;other.painSplitTurns=0;}
    if(other.trevenantCurseSource===mon)other.trevenantCurseSource=null;
  });
}
function applyTrevenantEndEffects(activeMons){
  activeMons.forEach(target=>{
    if(!target||target.fainted)return;
    const source=target.painSplitSource;
    if(source&&activeMons.includes(source)&&!source.fainted&&target.painSplitTurns>0){
      if(target.curHp/target.maxHp>source.curHp/source.maxHp){
        const d=Math.max(1,Math.floor(target.maxHp*.10)),h=Math.max(1,Math.floor(source.maxHp*.10));
        target.curHp=Math.max(0,target.curHp-d);source.curHp=Math.min(source.maxHp,source.curHp+h);target.painSplitTurns--;
        pushLog(`  ・ いたみわけ！ ${target.name} に${d}ダメージ、${source.name} は${h}回復！`,"#b061ff");
        if(target.curHp<=0)faintMon(target,target===me?"myImg":"foeImg");
      }else{target.painSplitSource=null;target.painSplitTurns=0;pushLog(`  ・ いたみわけは終了した。`,"#9fb3d6");}
    }
    const curseSource=target.trevenantCurseSource;
    if(curseSource&&activeMons.includes(curseSource)&&!curseSource.fainted){
      const targetDamage=Math.max(1,Math.floor(target.maxHp*.07)),sourceDamage=Math.max(1,Math.floor(curseSource.maxHp*.07));
      target.curHp=Math.max(0,target.curHp-targetDamage);curseSource.curHp=Math.max(0,curseSource.curHp-sourceDamage);
      pushLog(`  ・ のろい！ ${target.name} と ${curseSource.name} は HPが削られた！`,"#b061ff");
      if(target.curHp<=0)faintMon(target,target===me?"myImg":"foeImg");
      if(curseSource.curHp<=0)faintMon(curseSource,curseSource===me?"myImg":"foeImg");
    }
    const rivalKaiCurseSource=target.rivalKaiCurseSource;
    if(rivalKaiCurseSource&&!rivalKaiCurseSource.fainted){
      const damage=Math.max(1,Math.floor(target.maxHp*.25));
      target.curHp=Math.max(0,target.curHp-damage);
      pushLog(`  ・ のろい！ ${target.name} は HPが${damage}削られた！`,"#b061ff");
      if(target.curHp<=0)faintMon(target,target===me?"myImg":"foeImg");
    }
  });
  activeMons.forEach(m=>{if(!m||m.fainted)return;if(m.abilEff==="naturalcure"&&m.curHp<=m.maxHp*.30){const h=Math.max(1,Math.floor(m.maxHp*.10));m.curHp=Math.min(m.maxHp,m.curHp+h);pushLog(`  ★ ${m.name} の しぜんかいふく！ ${h}回復！`,"#46d160");}if(m.abilEff==="harvest"){const h=Math.max(1,Math.floor(m.maxHp*.07));m.curHp=Math.min(m.maxHp,m.curHp+h);pushLog(`  ★ ${m.name} の しゅうかく！ ${h}回復！`,"#46d160");}});
  renderHp();
}
function endTurn(){
  advanceFrozenGlaiveVulnerability([...myTeam,...foeTeam]);
  [...myTeam,...foeTeam].forEach(mon=>{if(mon.justSwitched)mon.justSwitched=false;if(mon.kokugaiBreathDoubleTurns>0)mon.kokugaiBreathDoubleTurns--;});
  [...myTeam,...foeTeam].forEach(mon=>{if(mon.tailwindTurns>0)mon.tailwindTurns--;});
  [...myTeam,...foeTeam].forEach(mon=>{mon.careCritGuard=false;});
  endDynamax(me,"myImg"); endDynamax(foe,"foeImg");
  [me,foe].forEach(m=>{if(m&&m.outrageTurns>0){m.outrageTurns--;if(m.outrageTurns===0){m.outrageMove=null;pushLog(`  ・ ${m.name} の 暴れ状態が 終わった！`);}}
    if(m&&m.reflectTurns>0)m.reflectTurns--;
    if(m&&m.auroraVeilTurns>0)m.auroraVeilTurns--;
    if(m&&m.falinksRightFootTurns>0)m.falinksRightFootTurns--;
    if(m&&m.falinksLeftFootTurns>0)m.falinksLeftFootTurns--;
    if(m&&m.duraludonShieldTurns>0)m.duraludonShieldTurns--;
    if(m&&m.roostedTypes){m.types=m.roostedTypes;m.roostedTypes=null;}
  });
  [me,foe].forEach(m=>{if(m&&m.yawnTurns>0){m.yawnTurns--;if(m.yawnTurns===0&&!m.status){m.status="sleep";m.sleepTurns=2+Math.floor(Math.random()*2);pushLog(`  ・ ${m.name} は ねむってしまった！`,"#9fb3d6");}}});
  [me,foe].forEach(target=>{
    const source=target===me?foe:me;
    const sleepy=target&&(target.yawnTurns>0||target.status==="sleep"||target.status==="hypersleep");
    if(source&&!source.fainted&&source.abilEff==="nightmarez"&&sleepy&&target.curHp>0){
      const d=Math.max(1,Math.floor(target.maxHp/4*constantDamageFactor(target)));
      target.curHp=Math.max(0,target.curHp-d); renderHp();
      pushLog(`  ★ ${source.name} の ナイトメアZ！ ${target.name} は ${d} ダメージ！`,"#b061ff");
      if(target.curHp<=0&&!target.fainted) faintMon(target,target===me?"myImg":"foeImg");
    }
  });
  applyTrevenantEndEffects([me,foe]);
  [me,foe].forEach(m=>{if(m&&!m.fainted&&m.itemKey==="toxicorb"&&m.acted>=1&&!m.status){applyStatus(m,"poison",m);}});
  [me,foe].forEach(m=>{if(m&&m.switchLock>0)m.switchLock--;});
  [me,foe].forEach(m=>{if(m&&m.tauntTurns>0)m.tauntTurns--;});
  [me,foe].forEach(m=>{if(m&&m.id==="morpeko"&&!m.fainted)switchMorpeko(m,m===me?foe:me);});
  [me,foe].forEach(m=>{if(m&&m.soundBlocked>0)m.soundBlocked--;});
  [me,foe].forEach(m=>{if(m&&m.coachTurns>0)m.coachTurns--;});
  [me,foe].forEach(m=>{if(m&&m.ritualTurns>0)m.ritualTurns--;});
  // かそく：すばやさ+1
  [["me",me],["foe",foe]].forEach(([s,m])=>{ if(!m.fainted&&m.abilEff==="speedboost"){ m.stages.spe=Math.min(6,m.stages.spe+1); pushLog(`  ・ ${m.name} の すばやさが 上がった（かそく）`,"#ff7043"); }});
  [me,foe].forEach(m=>{if(m&&m.peaceTurns>0){m.peaceTurns--;if(m.peaceTurns===0)pushLog(`  ・ ${m.name} の へいわせんこくの効果が切れた！`,"#7ad1ff");}});
  renderStages();
  [me,foe].forEach(m=>{if(m&&m.protectCooldown>0)m.protectCooldown--;if(m&&m.abilEff==="moody"&&!m.fainted)applyMoody(m);});
  applyResidual(me,"myImg",foe);
  applyResidual(foe,"foeImg",me);
  [me,foe].forEach(m=>{
    if(m&&!m.fainted&&m.abilEff==="poisonheal"&&(m.status==="poison"||m.status==="toxic")){
      const h=Math.max(1,Math.floor(m.maxHp/(m.id==="gliscor"?7:8)));
      m.curHp=Math.min(m.maxHp,m.curHp+h);
      pushLog(`  ・ ${m.name} は ポイズンヒールで ${h} 回復！`,"#46d160");
    }
  });
  [me,foe].forEach(m=>{if(m&&!m.fainted&&m.itemKey==="leftovers"){const h=Math.max(1,Math.floor(m.maxHp/16));m.curHp=Math.min(m.maxHp,m.curHp+h);pushLog(`  ・ ${m.name} は たべのこしで ${h} 回復！`,"#46d160");}});
  applyHoleCake([me]);
  applyHoleCake([foe]);
  [me,foe].forEach(m=>{if(m&&!m.fainted&&((m.itemKey==="orb"&&m.abilEff!=="sheerforce")||m.itemKey==="scarf")){m.curHp=Math.max(0,m.curHp-Math.max(1,Math.floor(m.maxHp/10)));pushLog(`  ・ ${m.name} は持ち物の反動でHPが減った！`,"#ff7043");}});
  if(grassTurns>0){
    [me,foe].forEach(m=>{if(m&&!m.fainted){const h=Math.max(1,Math.floor(m.maxHp/8));m.curHp=Math.min(m.maxHp,m.curHp+h);pushLog(`  ☘ ${m.name} はグラスフィールドで ${h} 回復！`,"#7ac74c");}});
    renderHp(); grassTurns--;
  }
  if(weatherTurns>0){weatherTurns--;if(weatherTurns===0){weather=null;renderWeather();pushLog("  ☁ 天候が もとに もどった！","#7ad1ff");}}
  if(electricTurns>0)electricTurns--;
  if(psychicTurns>0)psychicTurns--;
  if(mistTurns>0)mistTurns--;
  if(weather==="hail"){
    [me,foe].forEach(m=>{if(m&&!m.fainted&&!m.types.includes("ice")){const d=Math.max(1,Math.floor(m.maxHp/16*constantDamageFactor(m)));m.curHp=Math.max(0,m.curHp-d);pushLog(`  ・ ${m.name} は あられで ${d} ダメージ！`,"#a8d8e8");if(m.curHp<=0&&!m.fainted)faintMon(m,m===me?"myImg":"foeImg");}});
    renderHp();
  }
  // ひんしの入れ替え
  const foeDead=foe.fainted, meDead=me.fainted;
  if(!foeTeam.some(m=>!m.fainted)){ return finish(true); }
  if(!myTeam.some(m=>!m.fainted)){ return finish(false); }
  // me側の補充 → 完了したら次のターン
  const replaceMe=()=>{ meDead ? requestForcedSwitch("me", nextTurn) : nextTurn(); };
  // foe側の補充（CPUは自動 / フレンドはP2が選ぶ）
  if(foeDead){
    if(isCpuMode()) cpuForceReplace(replaceMe);
    else requestForcedSwitch("foe", replaceMe);
  } else replaceMe();
}
// 強制交代：そのsideの生きているポケモンを選ぶ（このターンは攻撃なし）
function requestForcedSwitch(side,cb){
  // NPCの交代先はCPUが決める。交代技から呼ばれた場合も手動選択を表示しない。
  if(side==="foe"&&mode!=="friend"){
    if(!foe.fainted&&cpuForcedSwitch()<0){cb();return;}
    cpuForceReplace(cb);return;
  }
  busy=true; inputSide=side; forcedCb=cb;
  const team=teamOf(side), ai=activeIdxOf(side), c=document.getElementById("cmd");
  let h=`<div class="center sub">${sideLabel(side)}：つぎの ポケモンを えらんでください</div><div class="switchrow">`;
  team.forEach((m,i)=>{const dead=m.fainted, active=(i===ai);
    h+=`<div class="sw ${dead?'dead':''} ${active?'active':''}" ${(!dead&&!active)?`onclick="pickForced('${side}',${i})"`:''}>
      <img src="${IMG(m.img)}"><div style="font-size:11px;font-weight:700">${m.name}</div>
      <div class="swhp">${m.fainted?'ひんし':`${m.curHp}/${m.maxHp}`}</div></div>`;});
  h+='</div>';
  c.innerHTML=h;
}
function pickForced(side,i){
  clearCmd();
  const cb=forcedCb; forcedCb=null;
  doSwitch(side,i,()=>{
    if(activeOf(side).fainted&&teamOf(side).some(m=>!m.fainted)) requestForcedSwitch(side,cb);
    else cb();
  });
}
function finish(meWon){
  busy=true; clearCmd();
  if(mode==='stadium'&&meWon){stadiumAfterWin();return;}
  if(mode==='tower'&&meWon){towerAfterWin();return;}
  if(mode==='lunatic'&&meWon) localStorage.setItem("ritoLunaticClear","1");
  if(mode==='lunatic2'&&meWon) localStorage.setItem("ritoLunatic2Clear","1");
  if(mode==='lunatic3'&&meWon) localStorage.setItem("ritoLunatic3Clear","1");
  if(mode==='lunatic4'&&meWon) localStorage.setItem("ritoLunatic4Clear","1");
  if(mode==='lunatic5'&&meWon) localStorage.setItem("ritoLunatic5Clear","1");
  if(mode==='dynamaxUnlock'&&meWon) localStorage.setItem("ritoDynamaxClear","1");
  // 解放状況も手持ち・育成内容と同じスナップショットへ保存する。
  if(meWon&&['lunatic','lunatic2','lunatic3','lunatic4','lunatic5','dynamaxUnlock'].includes(mode)) saveGame();
  if(mode==='cpu'){let n=Number(localStorage.getItem("ritoStreak")||0);n=meWon?n+1:0;const best=Math.max(Number(localStorage.getItem("ritoMaxStreak")||0),n);localStorage.setItem("ritoStreak",String(n));localStorage.setItem("ritoMaxStreak",String(best));saveGame();}
  document.getElementById("endArea").classList.remove("hidden");
  const r=document.getElementById("resultTxt");
  if(mode==='tower'&&!meWon){
    let saved=null;try{saved=JSON.parse(localStorage.getItem(TOWER_SAVE_KEY)||"null");}catch(e){}
    r.textContent=saved?.floor?`😵 あなたの負け… ${saved.floor}階のセーブ地点から再開できます。`:"😵 あなたの負け…";
    r.style.color="var(--hp-red)";if(saved?.floor)document.getElementById("towerResumeAfterLoss").classList.remove("hidden");return;
  }
  if(mode==='friend') r.textContent = meWon?"🏆 プレイヤー1の勝ち！":"🏆 プレイヤー2の勝ち！";
  else r.textContent = meWon?"🏆 あなたの勝ち！":"😵 あなたの負け…";
  r.style.color=meWon?"var(--accent)":"var(--hp-red)";
}
